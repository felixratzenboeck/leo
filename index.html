renderToolbar=function(){normaliseSettings();if(['pen','highlight'].includes(tool))penWidth=S.settings.studio[tool];core.renderToolbar();const before=$('[data-tool="hand"]',$('#toolbar'));before?.insertAdjacentHTML('beforebegin',`<button class="tool ${tool==='laser'?'active':''}" data-act="tool" data-tool="laser" aria-label="Laserpointer" aria-pressed="${tool==='laser'}" title="Laserpointer — verschwindet automatisch">${icon('target')}<small>Laser</small></button>`);const old=$('#penWidth');if(old){const [min,max,step]=rangeInfo(),w=widthForTool();old.outerHTML=`<label class="leo-width-control"><span class="leo-width-dot"><i id="leoSizeDot" style="width:${Math.min(18,w)}px;height:${Math.min(18,w)}px"></i></span><input type="range" id="leoToolWidth" min="${min}" max="${max}" step="${step}" value="${clamp(w,min,max)}" aria-label="${tool==='eraser'?'Radierergröße':'Strichstärke'}"><output id="leoWidthValue">${w}</output></label>`;}if(tool==='laser')$('#live').style.cursor='crosshair';};

eraseAt=function(pt){const p=page();if(!p||!activeOp)return;normaliseSettings();const before=p.items.length,radius=S.settings.studio.eraser/2;p.items=p.items.filter(it=>{if(!it.points)return true;const r=radius+(it.type==='highlight'?it.width*2.5:it.width)/2;if(!inRect(pt,boundsOf(it),r))return true;if(it.points.length===1)return Math.hypot(pt.x-it.points[0][0],pt.y-it.points[0][1])>r;for(let i=1;i<it.points.length;i++)if(segmentDistance(pt,it.points[i-1],it.points[i])<=r)return false;return true;});if(before!==p.items.length){activeOp.modified=true;renderInk();}};
function laserCanvas(){let c=$('#leoLaser');if(!c){c=document.createElement('canvas');c.id='leoLaser';c.setAttribute('aria-hidden','true');$('#paper').appendChild(c);}const ref=$('#live');if(c.width!==ref.width||c.height!==ref.height){c.width=ref.width;c.height=ref.height;}return c;}
function clearLaser(){state.laser=[];state.laserPointer=null;if(state.laserFrame)cancelAnimationFrame(state.laserFrame);state.laserFrame=0;const c=$('#leoLaser');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}
function laserDraw(){state.laserFrame=0;const c=$('#leoLaser');if(!c||!page()){clearLaser();return;}const now=performance.now(),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?450:1300;state.laser=state.laser.filter(p=>now-p.t<duration);const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.setTransform(canvasScale,0,0,canvasScale,0,0);ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle='#e65091';ctx.fillStyle='#ff77b6';ctx.shadowColor='#ee4c9b';ctx.shadowBlur=10;const list=state.laser;for(let i=0;i<list.length;i++){const p=list[i];ctx.globalAlpha=Math.max(0,1-(now-p.t)/duration);ctx.lineWidth=p.w;if(i&&p.group===list[i-1].group){ctx.beginPath();ctx.moveTo(list[i-1].x,list[i-1].y);ctx.lineTo(p.x,p.y);ctx.stroke();}else{ctx.beginPath();ctx.arc(p.x,p.y,p.w/2,0,Math.PI*2);ctx.fill();}}ctx.globalAlpha=1;ctx.shadowBlur=0;if(list.length)state.laserFrame=requestAnimationFrame(laserDraw);}
function laserPoint(e,start=false){const p=logicalPoint(e);const previous=state.laser.at(-1);if(!start&&previous&&Math.hypot(previous.x-p.x,previous.y-p.y)<.3)return;state.laser.push({x:p.x,y:p.y,t:performance.now(),w:widthForTool(),group:state.laserGroup});if(state.laser.length>4000)state.laser.splice(0,state.laser.length-4000);laserCanvas();if(!state.laserFrame)state.laserFrame=requestAnimationFrame(laserDraw);}
startPointer=function(e){if(tool==='laser'&&page()&&e.pointerType!=='touch'&&e.button===0&&!spaceHeld){if(state.laserPointer!==null)return;e.preventDefault();commitText();if(e.pointerType==='pen')lastPenAt=performance.now();state.laserPointer=e.pointerId;state.laserGroup=uid();try{e.target.setPointerCapture(e.pointerId);}catch{}laserPoint(e,true);return;}core.startPointer(e);};
movePointer=function(e){if(state.laserPointer===e.pointerId){e.preventDefault();if(e.pointerType==='pen')lastPenAt=performance.now();let evs=[];try{evs=e.getCoalescedEvents?.()||[];}catch{}if(!evs.length)evs=[e];evs.forEach(ev=>laserPoint(ev));return;}core.movePointer(e);};
finishPointer=function(e,cancel=false){if(state.laserPointer!==null&&(!e||state.laserPointer===e.pointerId)){if(cancel)clearLaser();else{if(e)laserPoint(e);state.laserPointer=null;}return;}core.finishPointer(e,cancel);};
openPage=async function(id){clearLaser();return core.openPage(id);};
closeEditor=function(){clearLaser();const cursor=$('#leoPointerCursor');if(cursor)cursor.style.display='none';return core.closeEditor();};
function cursorMove(e){const c=$('#leoPointerCursor');if(!c)return;if(tool==='eraser'&&page()&&e.pointerType!=='touch'&&e.target.closest('#viewport')){const size=Math.max(3,widthForTool()*zoom);c.style.cssText=`display:block;left:${e.clientX}px;top:${e.clientY}px;width:${size}px;height:${size}px`;}else c.style.display='none';}
function deviceDialog(){const capabilities=[['Lokale Datenbank',!!db,db?'IndexedDB aktiv':'Eingeschränkter Speicher-Fallback'],['Stifteingabe','PointerEvent'in window,'Druckdaten hängen vom Stift und Gerät ab'],['Audioaufnahme',!!navigator.mediaDevices?.getUserMedia&&'MediaRecorder'in window,'Mikrofonfreigabe erforderlich'],['Offline-App','serviceWorker'in navigator&&isSecureContext,'Benötigt HTTPS und das PWA-Paket'],['Dateien teilen',!!navigator.share,'Dateifreigabe ist browserabhängig'],['Speicher schützen',!!navigator.storage?.persist,'Der Browser entscheidet über die Freigabe']];modal('Dein Gerät. Deine Möglichkeiten.',`<p class="small muted" style="line-height:1.85">Die App nutzt verfügbare Funktionen und fällt sonst auf die lokale Basis zurück. Diese Anzeige ist eine API-Prüfung, kein Hardwaretest.</p><div class="leo-device-grid">${capabilities.map(([label,ok,text])=>`<div class="leo-capability"><strong>${ok?'✓':'○'} ${label}</strong><span>${text}</span></div>`).join('')}</div><div class="divider"></div><div class="row wrap">${action('Installieren / Anleitung','install','plus')}${btn('Speicherreservierung anfragen','persist','shield')}${btn('Backup sichern','backup','download')}</div><p class="leo-source-hint">Auf iPhone/iPad: Safari → Teilen → Zum Home-Bildschirm. Die lokale HTML-Datei allein installiert keine PWA. Neue PDF-Importe benötigen beim ersten Mal das PDF-Modul.</p>`,true);}
async function installApp(){if(state.installPrompt){await state.installPrompt.prompt();await state.installPrompt.userChoice;state.installPrompt=null;return;}modal('Leo als App nutzen',`<div class="hint"><strong>iPhone & iPad</strong><br>Die bereitgestellte HTTPS-Website in Safari öffnen → Teilen → „Zum Home-Bildschirm“.<br><br><strong>Mac & Desktop</strong><br>Die Installationsfunktion deines Browsers verwenden, wenn sie angeboten wird.</div><p class="small muted" style="margin-top:17px;line-height:1.8">Es wurde hier keine Website veröffentlicht. Für Offline-Start werden index.html, manifest.webmanifest, sw.js und leo-icon.svg gemeinsam benötigt. Sichere Notizen vor einem Wechsel der Adresse.</p>`);}
async function runAction(key,el){const id=el?.dataset.id||'';switch(key){case'go-tasks':navigate('tasks');break;case'new-task':taskDialogV2('','',el.dataset.status||'inbox');break;case'edit-task':taskDialogV2(id);break;case'subtask':taskDialogV2('',id,'inbox');break;case'task-menu':taskMenu(id);break;case'complete-task':changeStatus(id,'done');break;case'set-status':closeModal();changeStatus(id,el.dataset.status);break;case'remove-task':removeTask(id);break;case'task-view':state.taskView=el.dataset.value;S.settings.taskView=state.taskView;changed(false);renderView();break;case'task-undo':if(state.undo.length){S.tasks=state.undo.pop();saveTasks();toast('Letzte Aufgabenänderung zurückgenommen.');}break;case'new-folder':folderDialog();break;case'folder-toggle':{const xs=S.settings.folderCollapsed,i=xs.indexOf(id);if(i>=0)xs.splice(i,1);else xs.push(id);changed(false);renderShell();break;}case'choose-icon':$('#leoFolderIcon').value=el.dataset.value;break;case'profile':profileDialog();break;case'device-info':deviceDialog();break;case'install':await installApp();break;case'app-update':if(recorder){toast('Bitte zuerst die Aufnahme beenden.');break;}commitText();await flush();if(dirty||saveError){toast('Nicht gespeichert. Bitte vor dem Update ein Backup sichern.',true);break;}if(state.updateWorker){navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});state.updateWorker.postMessage({type:'LEO_ACTIVATE'});}break;default:toast('Unbekannte Studio-Aktion.',true);}}
dispatch=async function(act,el){if(act==='new-task'){taskDialogV2();return;}if(act==='delete-task'){removeTask(el.dataset.id);return;}if(act==='new-folder'){folderDialog();return;}if(act==='edit-folder'){folderDialog(el.dataset.id);return;}if(act==='tool'&&el.dataset.tool!=='laser'){clearLaser();}return core.dispatch(act,el);};
attachEvents=function(){core.attachEvents();if(state.eventsInstalled)return;state.eventsInstalled=true;const cursor=document.createElement('div');cursor.id='leoPointerCursor';cursor.className='leo-pointer-cursor';cursor.setAttribute('aria-hidden','true');document.body.appendChild(cursor);document.addEventListener('click',e=>{const el=e.target.closest('[data-leo]');if(!el||e.target.closest('[data-act]'))return;e.preventDefault();runAction(el.dataset.leo,el).catch(err=>{console.error(err);toast(err.message||'Aktion fehlgeschlagen.',true);});});document.addEventListener('input',e=>{const el=e.target;if(el.id==='leoTaskSearch'){state.query=el.value;$('#leoTaskBody').innerHTML=tasksBody();}if(el.id==='leoToolWidth'){const key=['eraser','laser','highlight'].includes(tool)?tool:'pen',v=Number(el.value);if(!Number.isFinite(v))return;S.settings.studio[key]=v;if(key==='pen'||key==='highlight')penWidth=v;$('#leoWidthValue').textContent=v;$('#leoSizeDot').style.width=Math.min(18,v)+'px';$('#leoSizeDot').style.height=Math.min(18,v)+'px';changed(false);}});document.addEventListener('change',e=>{const el=e.target;if(el.id==='leoTaskCourse'){state.course=el.value;$('#leoTaskBody').innerHTML=tasksBody();}if(el.dataset.leoSubcheck){const t=findTask(el.dataset.leoSubcheck);if(t){snapshot();setTaskStatus(t,el.checked?'done':'inbox');changed(false);el.closest('.leo-subtask-row')?.classList.toggle('done',t.done);}}});document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-task-card]');if(!card||card.getAttribute('draggable')!=='true')return;e.dataTransfer.setData('application/x-leo-task',card.dataset.taskCard);e.dataTransfer.effectAllowed='move';card.classList.add('dragging');});document.addEventListener('dragend',()=>{$$('.dragging,.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'));});document.addEventListener('dragover',e=>{const col=e.target.closest('[data-status-drop]');if(col&&e.dataTransfer.types.includes('application/x-leo-task')){e.preventDefault();e.dataTransfer.dropEffect='move';$$('.drag-over').forEach(x=>x.classList.remove('drag-over'));col.classList.add('drag-over');}});document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-status-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-over');});document.addEventListener('drop',e=>{const col=e.target.closest('[data-status-drop]');if(!col||!e.dataTransfer.types.includes('application/x-leo-task'))return;e.preventDefault();const id=e.dataTransfer.getData('application/x-leo-task');if(findTask(id))changeStatus(id,col.dataset.statusDrop);});document.addEventListener('pointermove',cursorMove,{passive:true});document.addEventListener('pointerleave',()=>{cursor.style.display='none';});window.addEventListener('blur',()=>{clearLaser();cursor.style.display='none';});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearLaser();});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.installPrompt=e;});document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.target.closest('input,textarea,select,[contenteditable]')||!$('#modalRoot').classList.contains('hidden'))return;if(e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();navigate('tasks');}if(currentPage&&e.key.toLowerCase()==='r'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){tool='laser';selected.clear();renderSelection();renderToolbar();$('#toolOptions').classList.remove('hidden');}});};
validateState=function(raw){const s=core.validateState(raw);for(const list of [s.tasks,s.folders]){const ids=new Set(list.map(x=>x.id));for(const x of list){if(x.parentId&&(!ids.has(x.parentId)||x.parentId===x.id))x.parentId='';const visited=new Set([x.id]);let p=x.parentId;while(p){if(visited.has(p)){x.parentId='';break;}visited.add(p);p=list.find(v=>v.id===p)?.parentId;}}}for(const t of s.tasks){t.title=String(t.title||'Aufgabe').slice(0,400);t.description=String(t.description||'').slice(0,20000);t.course=String(t.course||'').slice(0,150);t.due=dateOK(t.due)?t.due:'';if(!priorityNames[t.priority])t.priority='normal';t.status=taskState(t);}return s;};
init=async function(){await core.init();if(!S||!$('#sidebar'))return;normaliseSettings();state.taskView=['board','list','tree'].includes(S.settings.taskView)?S.settings.taskView:'board';window.LeoStudio=Object.freeze({version:'2.0.0',getState:()=>clone(S),getStatus:()=>({view,tool,laserPoints:state.laser.length,storage:db?'indexeddb':'fallback',bridgeConnected:bridge.connected}),registerView(def){if(!def||!/^plugin-[a-z0-9-]+$/.test(def.id)||typeof def.render!=='function')throw Error('Plugin benötigt eine plugin-… ID und eine render-Funktion.');if(views.has(def.id))throw Error('Diese Plugin-ID existiert bereits.');views.set(def.id,Object.freeze({...def}));},navigate,flush});if('serviceWorker'in navigator&&isSecureContext){navigator.serviceWorker.getRegistration().then(reg=>{if(!reg)return;const show=()=>{if(reg.waiting){state.updateWorker=reg.waiting;if(view==='home')renderView();}};show();reg.addEventListener('updatefound',()=>reg.installing?.addEventListener('statechange',show));}).catch(()=>{});}renderShell();renderView();};
})();

init().catch(e=>{console.error(e);document.body.innerHTML=`<div class="card" style="margin:30px"><h1>Leo konnte nicht starten.</h1><p style="margin:15px 0">${esc(e.message)}</p><p>Bitte in einem aktuellen Safari, Chrome oder Firefox öffnen, nicht in einer Dateivorschau. Vorhandene Browserdaten nicht löschen.</p><button class="btn" onclick="location.reload()">Erneut versuchen</button></div>`});
