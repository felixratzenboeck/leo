function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function openDB(){if(!('indexedDB'in window))return;db=await new Promise((resolve,reject)=>{const r=indexedDB.open('folio-private-v1',1);r.onupgradeneeded=()=>{for(const name of ['kv','assets','libs'])if(!r.result.objectStoreNames.contains(name))r.result.createObjectStore(name)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('Speicher wird von einem anderen Tab blockiert.'))});db.onversionchange=()=>{db.close();toast('Leo wurde in einem anderen Tab aktualisiert. Bitte neu laden.',true)}}
async function dbGet(store,key){if(db)return request(db.transaction(store,'readonly').objectStore(store).get(key));if(store==='assets')return memAssets.get(key)||JSON.parse(localStorage.getItem('folio-asset-'+key)||'null');if(store==='kv')return JSON.parse(localStorage.getItem(key==='state'?'folio-state-v1':'folio-kv-'+key)||'null');return null}
async function dbPut(store,key,value){if(db)return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(value,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error('Speicherung abgebrochen'))});if(store==='assets'){const v={...value,data:await toBase64(value.data)};localStorage.setItem('folio-asset-'+key,JSON.stringify(v));memAssets.set(key,value)}else if(store==='kv')localStorage.setItem(key==='state'?'folio-state-v1':'folio-kv-'+key,JSON.stringify(value))}
async function dbDel(store,key){if(db)return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=resolve;t.onerror=()=>reject(t.error)});if(store==='assets'){memAssets.delete(key);localStorage.removeItem('folio-asset-'+key)}}
async function dbAll(store){if(db){const tx=db.transaction(store,'readonly');return request(tx.objectStore(store).getAll())}if(store==='assets'){const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('folio-asset-'))out.push(JSON.parse(localStorage.getItem(k)))}return out}return []}

function toBase64(data){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(data instanceof Blob?data:new Blob([data]))})}

gen</strong><small>${due?due+' Karten heute fällig':'Deine Lernkarten erstellen'}</small></span></button></div><div class="row muted tiny" style="margin-top:24px;gap:7px">${icon('lock',true)}Ohne Werbung. Ohne Tracking. Ganz dein Raum.</div></div><div class="home-aside"><section class="aside-card"><div class="sectionhead"><h3>Ein guter Fokus für heute</h3>${ib('plus','new-task','Aufgabe hinzufügen')}</div>${tasks.length?tasks.map(taskRow).join(''):`<p class="small muted" style="line-height:1.8">Ein kleiner Schritt ist ein guter Anfang. Was möchtest du heute schaffen?</p>${btn('Tagesziel hinzufügen','new-task','plus','ghost','style="margin-top:12px;padding-left:0"')}`}</section><section class="aside-card"><div class="row between"><h3>Raum für Konzentration</h3>${icon('clock',true)}</div><div class="focus-clock" data-focus-clock>${timeLabel(focusEnd?(focusEnd-Date.now())/1000:focusSeconds)}</div><p class="tiny muted">25 Minuten · nur du und dein Thema</p><div class="row" style="margin-top:15px">${btn(focusEnd?'Pausieren':'Fokus starten','focus-toggle',focusEnd?'pause':'play','', 'style="flex:1"')}${ib('restore','focus-reset','Timer zurücksetzen')}</div></section><section class="aside-card"><div class="sectionhead"><h3>Dein vernetzter Lernraum</h3>${icon('link',true)}</div>${[['L','Leo / OpenClaw',bridge.capabilities.openclaw],['m','Moodle FH OÖ',bridge.capabilities.moodle],['↗','Levis',bridge.capabilities.levis]].map(([mark,name,ready])=>`<div class="connector-mini"><span class="row"><span class="service-mark">${mark}</span>${name}</span><span class="tiny muted">${ready?'Konfiguriert':'Einrichten'}</span></div>`).join('')}<button class="small" style="margin-top:14px;color:var(--accent)" data-act="nav" data-view="connections">Verbindungen verwalten ${icon('arrow',true)}</button></section></div></div>`}
function taskRow(t){return `<div class="task-row ${t.done?'done':''}"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''} aria-label="${esc(t.title)} erledigt"><div class="grow"><span>${esc(t.title)}</span>${t.due?`<small>${localDate(t.due+'T12:00:00')} ${t.course?'· '+esc(t.course):''}</small>`:''}</div>${ib('close','delete-task','Aufgabe entfernen',`data-id="${t.id}"`)}</div>`}
function renderLibrary(){const f=S.folders.find(f=>f.id===folderFilter);let books=S.notebooks.filter(b=>!b.deleted&&(view!=='favorites'||b.favorite)&&(view!=='folder'||b.folderId===folderFilter));books.sort(sortMode==='title'?(a,b)=>a.title.localeCompare(b.title,'de'):(a,b)=>b.updated-a.updated);return `<div class="pagehead"><div><div class="date-label">DEINE PERSÖNLICHE BIBLIOTHEK</div><h1>${esc(view==='favorites'?'Deine Favoriten':f?.name||'Platz für alles.')}</h1><p>${books.length} Notizbücher · ${books.reduce((s,b)=>s+pagesFor(b.id).length,0)} Seiten${f?' · Fachordner':''}</p></div><div class="row">${btn('Importieren','import','upload')}${btn('Notizbuch','new-book','plus','primary')}</div></div><div class="row between" style="margin:24px 0"><div class="row wrap"><button class="tag" data-act="nav" data-view="library">Alle Fächer</button>${S.folders.map(x=>`<button class="tag" data-act="folder" data-id="${x.id}" style="${x.id===folderFilter?'background:var(--accent2);color:var(--accent)':''}">${esc(x.name)}</button>`).join('')}${ib('plus','new-folder','Fach hinzufügen')}${f?ib('edit','edit-folder','Fach bearbeiten',`data-id="${f.id}"`):''}</div><select id="sortMode" aria-label="Notizbücher sortieren" style="font-size:11px;padding:7px"><option value="recent" ${sortMode==='recent'?'selected':''}>Zuletzt bearbeitet</option><option value="title" ${sortMode==='title'?'selected':''}>Alphabetisch</option></select></div><div class="library-books"><div class="notebooks">${books.map(bookCard).join('')}</div>${!books.length?empty('Ein frisches Kapitel','Hier ist noch Platz für deine Notizen.','Notizbuch erstellen','new-book'):''}</div>${f?renderResources(f.id):''}`}
function renderResources(folderId){const rs=S.resources.filter(r=>r.folderId===folderId);if(!rs.length)return '';return `<div class="sectionhead" style="margin-top:30px"><h2>Kursmaterialien aus Moodle</h2><span class="badge">${rs.length} DATEIEN</span></div>${rs.map(r=>`<div class="resource row"><span class="service-mark">${icon('file',true)}</span><div class="grow"><h3>${esc(r.name)}</h3><div class="tiny muted">${esc(r.section||'Kursmaterial')} · ${r.size?humanSize(r.size):'Größe unbekannt'}</div></div>${btn('Importieren','import-resource','download','',`data-id="${r.id}"`)}</div>`).join('')}`}
function renderTrash(){const list=S.notebooks.filter(b=>b.deleted);return `<div class="pagehead"><div><h1>Papierkorb</h1><p>Notizbücher bleiben hier, bis du sie ausdrücklich endgültig löschst.</p></div></div>${list.map(b=>`<div class="resource row"><span class="service-mark">${icon('book',true)}</span><div class="grow"><h3>${esc(b.title)}</h3><p class="tiny muted">${pagesFor(b.id).length} Seiten</p></div>${btn('Wiederherstellen','restore-book','restore','',`data-id="${b.id}"`)}${ib('trash','purge-book','Endgültig löschen',`data-id="${b.id}"`)}</div>`).join('')||empty('Alles aufgeräumt','Gelöschte Notizbücher findest du hier.','','','trash')}`}
function renderCalendar(){const events=S.events.filter(e=>e.start>=Date.now()-86400000).sort((a,b)=>a.start-b.start);return `<div class="pagehead"><div><div class="date-label">DEIN STUDIENALLTAG, SORTIERT</div><h1>Semesterplan</h1><p>Termine, Abgaben und die nächsten kleinen Schritte.</p></div><div class="row">${btn('Kalender importieren','import-ics','upload')}${btn('Termin','new-event','plus','primary')}</div></div><div class="two-col"><section class="card"><div class="sectionhead"><h2>Als Nächstes</h2><span class="badge">${events.length} TERMINE</span></div><div class="calendar-list">${events.slice(0,60).map(e=>`<div class="event"><div class="event-date"><strong>${localDate(e.start,{day:'numeric'})}</strong><small>${localDate(e.start,{month:'short'})}</small></div><div class="grow"><h3>${esc(e.title)}</h3><p class="tiny muted">${e.allDay?'Ganztägig':localDate(e.start,{hour:'2-digit',minute:'2-digit'})}${e.location?' · '+esc(e.location):''}</p><span class="tiny muted">${esc(e.source||'Persönlich')}</span></div>${ib('close','delete-event','Termin entfernen',`data-id="${e.id}"`)}</div>`).join('')||empty('Dein Kalender ist noch frei','Importiere eine ICS-Datei oder lege einen Termin an. Levis wird erst nach Einrichtung synchronisiert.','','','calendar')}</div></section><section class="card"><div class="sectionhead"><h2>Aufgaben & Abgaben</h2>${ib('plus','new-task','Aufgabe hinzufügen')}</div>${S.tasks.slice().sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(taskRow).join('')||empty('Ein Ziel gibt die Richtung','Halte Abgaben und Lernziele an einem Ort fest.','Aufgabe hinzufügen','new-task','check')}</section></div>`}
function renderStudy(){const cards=S.cards.filter(c=>!c.notebookId||S.notebooks.some(b=>b.id===c.notebookId&&!b.deleted));const due=cards.filter(c=>c.due<=Date.now());return `<div class="pagehead"><div><div class="date-label">AUS NOTIZEN WIRD WISSEN</div><h1>Einmal verstehen.<br><span class="serif">Immer wieder erinnern.</span></h1><p>Karteikarten mit Wiederholungsintervallen. Lokal, ohne KI-Abo.</p></div>${btn('Neue Lernkarte','new-card','plus','primary')}</div><div class="two-col"><section class="card"><div class="row between"><span class="label">HEUTE WIEDERHOLEN</span>${icon('cards')}</div><div style="font:64px var(--serif);margin:15px 0">${due.length}<span style="font:14px var(--sans);color:var(--muted);margin-left:15px">von ${cards.length} Karten</span></div><p class="small muted" style="margin-bottom:22px">Gib jeder Antwort eine ehrliche Bewertung. Leo plant die nächste Wiederholung.</p>${btn('Lernrunde starten','start-review','play','primary',due.length?'':'disabled')}${cards.length?btn('Alle Karten üben','review-all','cards','ghost'):''}</section><section class="card"><h2>Aktiv statt nur nochmal lesen.</h2><p class="small muted" style="margin:12px 0 20px;line-height:1.9">Nutze das Abdeckband im Editor für Beschriftungen. Erstelle Frage und Antwort direkt aus deinen Seitennotizen. Mit verbundener Leo-Bridge kannst du zusätzlich Karten vorschlagen lassen.</p><div class="row wrap"><span class="badge">ABDECKBAND</span><span class="badge">SEITENBEZUG</span><span class="badge">SPACED REPETITION</span></div></section></div><div class="sectionhead" style="margin-top:30px"><h2>Deine Karten</h2><span class="small muted">${cards.length} gesammelt</span></div>${cards.map(c=>`<div class="resource row"><span class="service-mark">${icon('cards',true)}</span><div class="grow"><h3>${esc(c.front)}</h3><p class="tiny muted">${esc(S.notebooks.find(b=>b.id===c.notebookId)?.title||'Freie Lernkarte')} · ${c.due<=Date.now()?'Heute fällig':'Wieder am '+localDate(c.due)}</p></div>${ib('edit','edit-card','Karte bearbeiten',`data-id="${c.id}"`)}${ib('trash','delete-card','Karte löschen',`data-id="${c.id}"`)}</div>`).join('')||empty('Dein Wissen wächst hier','Die erste Karte ist der Anfang.','Lernkarte erstellen','new-card','cards')}`}
function renderConnections(){return `<div class="pagehead"><div><div class="date-label">OFFENE SCHNITTSTELLEN. DEINE KONTROLLE.</div><h1>Alles verbunden.<br><span class="serif">Nichts vorgetäuscht.</span></h1><p>Lokale Notizen funktionieren sofort. Externe Dienste brauchen deine private Bridge und Freigaben.</p></div>${staticDemo?'':btn('Bridge verbinden','bridge-login','link','primary')}</div>${staticDemo?'<div class="hint warning" style="margin-bottom:23px"><strong>Öffentliche Demo.</strong> Die private Leo-Bridge ist hier bewusst deaktiviert. Öffne dafür deine private Tailscale-Adresse.</div>':''}<div class="hint ${bridge.connected?'':'warning'}" style="margin-bottom:23px"><strong>${bridge.connected?'Private Bridge erreichbar.':'Noch im lokalen Modus.'}</strong> ${bridge.connected?'Konfigurierte Dienste sind nicht automatisch erfolgreich angemeldet. Teste Moodle und Leo separat.':'OpenClaw, Moodle und Levis sind hier noch nicht angemeldet. Das Workspace-Paket enthält den Server und die Einrichtungsanleitung; es ersetzt deine bestehende Leo-App nicht.'}</div><div class="settings-grid"><section class="card integration"><div class="row between"><span class="service-mark">L</span><span class="badge">${bridge.capabilities.openclaw?'KONFIGURIERT':'SETUP ERFORDERLICH'}</span></div><h3>Leo / OpenClaw</h3><p>Dein Assistent kann nach Freigabe Notizbücher, Seiten, Anhänge und Lernkarten über die private API lesen. Schreibzugriff lässt sich getrennt aktivieren. Gateway-Schlüssel bleiben auf dem Server.</p><div class="row wrap">${btn('Leo öffnen','open-leo','spark')}${btn('Notizen synchronisieren','sync','cloud','',bridge.connected?'':'disabled')}</div></section><section class="card integration"><div class="row between"><span class="service-mark" style="background:#f2e2ce;color:#8c6130">m</span><span class="badge">${bridge.capabilities.moodle?'TOKEN KONFIGURIERT':'NICHT VERBUNDEN'}</span></div><h3>Moodle · FH Gesundheitsberufe OÖ</h3><p>Kurse als Fächer übernehmen, verfügbare Materialien finden und unterstützte Abgabetermine importieren. Voraussetzung: von der FH erlaubter Webservice-Token und freigegebene Funktionen.</p><div class="row wrap">${btn('Kurse abrufen','moodle-sync','restore','',bridge.connected?'':'disabled')}<a class="btn" href="https://moodle.fhgooe.ac.at/my/courses.php" target="_blank" rel="noopener noreferrer">Moodle öffnen ${icon('external',true)}</a></div></section><section class="card integration"><div class="row between"><span class="service-mark" style="background:#e0deed;color:#6a5c84">↗</span><span class="badge">API NICHT VERIFIZIERT</span></div><h3>Levis · dein FH-Kalender</h3><p>ICS-Dateien kannst du schon importieren. Eine Live-Verbindung kann der Workspace erst mit einem echten Kalenderexport oder einer erlaubten Schnittstelle einrichten. Keine erfundenen Levis-API-Endpunkte.</p><div class="row wrap">${btn('ICS importieren','import-ics','calendar')}${btn('Kalender abrufen','levis-sync','restore','',bridge.capabilities.levis?'':'disabled')}<a class="btn ghost" href="https://levis.fh-gesundheitsberufe.at/Shared/Home.aspx" target="_blank" rel="noopener noreferrer">Levis öffnen ${icon('external',true)}</a></div></section><section class="card integration"><div class="row between"><span class="service-mark">${icon('shield')}</span><span class="badge">DEIN BESTAND</span></div><h3>Datensicherung & Gerätewechsel</h3><p>Ein vollständiges Leo-Backup enthält Seiten, Stiftstriche, Bilder, PDF-Originale, Audio und Lernkarten. Ein Serverabgleich ist ein expliziter Snapshot-Abgleich mit Konfliktprüfung – keine Echtzeit-Kollaboration.</p><div class="row wrap">${btn('Vollständiges Backup','backup','download')}${btn('Backup importieren','import-backup','upload')}</div></section></div><div class="hint" style="margin-top:24px"><strong>Private Bridge:</strong> Noch nicht eingerichtet. Diese Leo-App arbeitet lokal; für Leo, Moodle und Levis brauchst du eine separat eingerichtete private Bridge über Tailscale-HTTPS. Vorhandene Leo-Dienste bleiben dabei unberührt.</div>`}
function renderSettings(){return `<div class="pagehead"><div><div class="date-label">LEO / VERSION 1.0</div><h1>So, wie du arbeitest.</h1><p>Stift, Papier, Speicher und Schnittstellen.</p></div>${btn('Hilfe & Tastenkürzel','help','info')}</div><div class="settings-grid"><section class="card"><h2>Schreibgefühl</h2><div class="divider"></div><label class="checkline"><input type="checkbox" id="set-penOnly" ${S.settings.penOnly?'checked':''}>Mit Stift schreiben, mit Finger verschieben</label><p class="tiny muted">Maus funktioniert weiterhin. Stiftmodus verhindert Fingerstriche; hardwareseitige Handballenerkennung hängt vom Gerät ab.</p><label class="checkline"><input type="checkbox" id="set-pressure" ${S.settings.pressure?'checked':''}>Druckabhängige Strichstärke</label><div class="field" style="margin-top:15px"><label for="set-smoothing">Glättung</label><input type="range" id="set-smoothing" min="0" max="0.65" step="0.05" value="${S.settings.smoothing}"></div><div class="field"><label for="set-template">Standardpapier</label><select id="set-template">${Object.entries(TEMPLATES).map(([v,t])=>`<option value="${v}" ${S.settings.defaultTemplate===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="hint small">Stifteingabe nutzt Browser-Pointer-Events. Apple-Pencil-Doppeltippen, Squeeze und native Handschrifterkennung werden nicht als implementiert ausgegeben.</div></section><section class="card"><h2>Darstellung & Speicher</h2><div class="divider"></div>${btn(S.settings.theme==='dark'?'Helle Oberfläche':'Dunkle Oberfläche','theme',S.settings.theme==='dark'?'sun':'moon')}<div class="divider"></div><p class="small muted" id="storageEstimate">Speicher wird geprüft …</p><p class="small muted" style="margin:10px 0 17px">Browserdaten können gelöscht werden. Regelmäßige Backups sind wichtig. Diese Version verschlüsselt lokale Notizen nicht selbst.</p><div class="row wrap">${btn('Backup exportieren','backup','download')}${btn('Dauerhaften Speicher anfragen','persist','shield')}${btn('Vor letztem Sync wiederherstellen','restore-local-snapshot','restore')}</div><p class="tiny muted" style="margin-top:15px">Letztes Backup: ${S.settings.backupAt?localDate(S.settings.backupAt,{day:'numeric',month:'long',year:'numeric'}):'noch keines'}</p><div class="hint warning" style="margin-top:17px">Keine identifizierbaren Patientendaten ohne eine dafür freigegebene, ausreichend geschützte Umgebung speichern.</div></section><section class="card"><h2>Private Bridge</h2><div class="divider"></div><p class="small muted">${bridge.connected?'Sitzung angemeldet.':'Noch keine authentifizierte Verbindung.'} Zugangsdaten werden nicht im Leo-Backup gespeichert.</p><div class="row wrap" style="margin-top:18px">${btn(bridge.connected?'Verbindung prüfen':'Verbinden','bridge-login','link')}${bridge.connected?btn('Abmelden','bridge-logout','lock'):''}${btn('Bestand synchronisieren','sync','cloud','',bridge.connected?'':'disabled')}</div><label class="checkline" style="margin-top:14px"><input type="checkbox" id="set-autoSync" ${S.settings.autoSync?'checked':''} ${bridge.connected?'':'disabled'}>Änderungen bei geöffneter App automatisch hochladen</label><p class="tiny muted">Nur nach einem ersten manuellen Abgleich. Konflikte stoppen die automatische Übertragung. Andere Geräte müssen Änderungen ausdrücklich übernehmen.</p></section><section class="card"><h2>Was diese Version kann</h2><div class="divider"></div><p class="small muted" style="line-height:1.95">Stift, Marker, Strichradierer, Lasso, Text, Formen, Bilder, Abdeckband, Vorlagen, Seitensortierung, Lernkarten, Audio mit Seitenmarken, Suche in Text und PDF-Text, Backups und PDF-Export.</p><p class="small muted" style="margin-top:12px;line-height:1.95">Kein vollständiger Goodnotes-6-Klon: keine native Handschrift-OCR, Mathe-Erkennung, iCloud-Synchronisierung, Live-Kollaboration oder proprietären .goodnotes-Dateien. KI ist erst mit eingerichteter Leo-Bridge verfügbar.</p><div class="row wrap" style="margin-top:18px">${btn('PDF-Modul vorbereiten','prepare-pdf','download')}${btn('Hilfe','help','info')}</div><p class="tiny muted" style="margin-top:12px">Der kompakte HTML-Kern hat keine Bibliotheksabhängigkeit. PDF.js wird bei Bedarf separat geladen und lokal zwischengespeichert; im Workspace kann es vollständig eingebettet werden.</p></section></div>`}

if(activeOp)return;commitText();e.preventDefault();try{e.target.setPointerCapture(e.pointerId)}catch{}const pan=pt.x<0||pt.y<0||pt.x>page().width||pt.y>page().height||tool==='hand'||spaceHeld||(e.pointerType==='touch'&&S.settings.penOnly);if(pan){activeOp={kind:'pan',id:e.pointerId,pointerType:e.pointerType,start:pt,client:{x:e.clientX,y:e.clientY},scroll:{x:$('#viewport').scrollLeft,y:$('#viewport').scrollTop},moved:false};return}if(tool==='text'){const hit=[...page().items].reverse().find(it=>it.type==='text'&&inRect(pt,boundsOf(it),5));beginText(pt,hit);return}if(tool==='image'){pickFiles('image/*','image');return}const before=clone(page().items);if(tool==='lasso'){const b=selectionBounds();if(b&&inRect(pt,b,8)){activeOp={kind:'move',id:e.pointerId,pointerType:e.pointerType,start:pt,before,originals:clone(page().items.filter(i=>selected.has(i.id))),modified:false};return}selected.clear();renderSelection();activeOp={kind:'lasso',id:e.pointerId,pointerType:e.pointerType,poly:[pt],start:pt};return}if(tool==='eraser'||e.buttons===32){activeOp={kind:'erase',id:e.pointerId,pointerType:e.pointerType,before,modified:false};eraseAt(pt);return}let item;if(tool==='pen'||tool==='highlight')item={id:uid(),type:tool,color:tool==='highlight'&&penColor==='#294638'?'#dac767':penColor,width:penWidth,pressure:S.settings.pressure,points:[pointArray(pt)],...(recorder?{audioId:recordingId,at:Math.round(performance.now()-recordStart)}:{})};else if(tool==='shapes'||tool==='tape')item={id:uid(),type:tool==='shapes'?'shape':'tape',shape,color:tool==='tape'?'#d9c28c':penColor,width:penWidth,x:pt.x,y:pt.y,w:0,h:0};if(item){activeOp={kind:'draw',id:e.pointerId,pointerType:e.pointerType,start:pt,item,before,last:pt};queueDraw()}}
function movePointer(e){if(e.pointerType==='touch'&&pointers.has(e.pointerId)){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gesture?.kind==='pinch'&&pointers.size>=2){e.preventDefault();const pp=[...pointers.values()],d=Math.hypot(pp[0].x-pp[1].x,pp[0].y-pp[1].y),mid={x:(pp[0].x+pp[1].x)/2,y:(pp[0].y+pp[1].y)/2};setZoom(gesture.zoom*d/Math.max(1,gesture.distance),mid);return}}if(!activeOp||activeOp.id!==e.pointerId)return;e.preventDefault();const op=activeOp,pt=logicalPoint(e);if(op.kind==='pan'){const dx=e.clientX-op.client.x,dy=e.clientY-op.client.y;$('#viewport').scrollLeft=op.scroll.x-dx;$('#viewport').scrollTop=op.scroll.y-dy;op.moved=op.moved||Math.hypot(dx,dy)>6;return}if(op.kind==='erase'){eraseAt(pt);return}if(op.kind==='lasso'){op.poly.push(pt);queueDraw();return}if(op.kind==='move'){const dx=pt.x-op.start.x,dy=pt.y-op.start.y;for(const original of op.originals){const it=page().items.find(i=>i.id===original.id);if(!it)continue;if(it.points)it.points=original.points.map(p=>[p[0]+dx,p[1]+dy,p[2],p[3]]);else{it.x=original.x+dx;it.y=original.y+dy}}op.modified=true;renderInk();return}if(op.item.points){let events=[];try{events=e.getCoalescedEvents?.()||[]}catch{}if(!events.length)events=[e];for(const ev of events){const v=logicalPoint(ev),prev=op.item.points.at(-1);if(Math.hypot(v.x-prev[0],v.y-prev[1])<.18)continue;const smooth=S.settings.smoothing;v.x=v.x*(1-smooth)+prev[0]*smooth;v.y=v.y*(1-smooth)+prev[1]*smooth;op.item.points.push(pointArray(v))}}else{op.item.w=pt.x-op.start.x;op.item.h=pt.y-op.start.y;if(e.shiftKey&&['rect','ellipse'].includes(op.item.shape)){const n=Math.max(Math.abs(op.item.w),Math.abs(op.item.h));op.item.w=Math.sign(op.item.w||1)*n;op.item.h=Math.sign(op.item.h||1)*n}}queueDraw()}
function finishPointer(e,cancel=false){if(e?.pointerType==='touch'){pointers.delete(e.pointerId);if(gesture){if(pointers.size<2)gesture=null;if(!activeOp)return}}if(!activeOp||(e&&activeOp.id!==e.pointerId))return;const op=activeOp;activeOp=null;if(cancel){if(op.before)page().items=op.before;renderInk();return}if(op.kind==='draw'){const it=op.item;if(!it.points){if(Math.abs(it.w)<3&&Math.abs(it.h)<3){drawLive();return}if(it.type==='tape'||['rect','ellipse'].includes(it.shape)){if(it.w<0){it.x+=it.w;it.w=-it.w}if(it.h<0){it.y+=it.h;it.h=-it.h}}}historyPush(op.before);page().items.push(it);renderInk();markPage()}else if(op.kind==='erase'||op.kind==='move'){if(op.modified){historyPush(op.before);renderInk();markPage()}}else if(op.kind==='lasso'){if(op.poly.length>3){for(const it of page().items){const b=boundsOf(it),center={x:b.x+b.w/2,y:b.y+b.h/2};if(inPolygon(center,op.poly)||(it.points&&it.points.some(p=>inPolygon({x:p[0],y:p[1]},op.poly))))selected.add(it.id)}}else{const pt=op.start,hit=[...page().items].reverse().find(it=>inRect(pt,boundsOf(it),9));if(hit)selected.add(hit.id)}renderSelection();drawLive()}else if(op.kind==='pan'&&!op.moved){const it=[...page().items].reverse().find(i=>i.type==='tape'&&inRect(op.start,boundsOf(i)));if(it){if(tapeReveals.has(it.id))tapeReveals.delete(it.id);else tapeReveals.add(it.id);renderInk()}}drawLive()}
function markPage(){updateThumb();changed()}
function updateThumb(){const p=page();if(!p)return;try{const c=document.createElement('canvas');c.width=180;c.height=Math.round(180*p.height/p.width);const ctx=c.getContext('2d');ctx.drawImage($('#paperBg'),0,0,c.width,c.height);ctx.drawImage($('#ink'),0,0,c.width,c.height);p.thumb=c.toDataURL('image/jpeg',.55);const el=$(`.page-thumb[data-id="${p.id}"] .thumb-paper`);if(el)el.innerHTML=`<img src="${p.thumb}" alt="Seitenvorschau">`}catch{}}
function renderSelection(){const n=selected.size;$('#selectionActions').classList.toggle('hidden',!n);if(!n)return;$('#selectionActions').innerHTML=`<span class="tiny muted" style="padding:8px">${n}</span>${ib('copy','copy-selection','Kopieren (⌘ C)')}${ib('plus','duplicate-selection','Duplizieren')}${ib('minus','shrink-selection','Verkleinern')}${ib('zoom','grow-selection','Vergrößern')}${ib('rotate','rotate-selection','15° drehen')}${ib('trash','delete-selection','Auswahl löschen')}${ib('close','clear-selection','Auswahl aufheben')}`;}
function transformSelection(scale=1,degrees=0){const b=selectionBounds();if(!b)return;historyPush();const cx=b.x+b.w/2,cy=b.y+b.h/2,rad=degrees*Math.PI/180,transform=(x,y)=>({x:cx+scale*((x-cx)*Math.cos(rad)-(y-cy)*Math.sin(rad)),y:cy+scale*((x-cx)*Math.sin(rad)+(y-cy)*Math.cos(rad))});for(const it of page().items.filter(i=>selected.has(i.id))){if(it.points){it.points=it.points.map(p=>{const q=transform(p[0],p[1]);return[q.x,q.y,p[2],p[3]]});it.width*=scale}else{const c=transform(it.x+it.w/2,it.y+it.h/2);it.w*=scale;it.h*=scale;it.x=c.x-it.w/2;it.y=c.y-it.h/2;it.angle=(it.angle||0)+degrees;if(it.type==='text')it.fontSize*=scale}}renderInk();markPage()}
function copySelection(){clipboardItems=clone(page().items.filter(i=>selected.has(i.id)));toast(`${clipboardItems.length} Elemente in Leo-Zwischenablage`)}
function pasteSelection(items=clipboardItems){if(!page()||!items.length)return;historyPush();const copies=clone(items).map(it=>{it.id=uid();if(it.points)it.points=it.points.map(p=>[p[0]+20,p[1]+20,p[2],p[3]]);else{it.x+=20;it.y+=20}return it});page().items.push(...copies);selected=new Set(copies.map(i=>i.id));tool='lasso';renderToolbar();renderSelection();renderInk();markPage()}
function deleteSelection(){if(!selected.size)return;historyPush();page().items=page().items.filter(i=>!selected.has(i.id));selected.clear();renderSelection();renderInk();markPage()}
function beginText(pt,existing){commitText();const p=page(),it=existing||{id:uid(),type:'text',x:clamp(pt.x,10,p.width-120),y:clamp(pt.y,10,p.height-50),w:Math.min(390,p.width-pt.x-20),h:75,text:'',color:penColor,fontSize:Number(S.settings.fontSize||22)};if(it.w<100)it.w=100;textEdit={item:clone(it),existing:!!existing,pageId:p.id};const ta=document.createElement('textarea');ta.className='floating-editor';ta.id='canvasTextEditor';ta.setAttribute('aria-label','Text auf der Seite');ta.value=it.text;ta.placeholder='Dein Gedanke …';Object.assign(ta.style,{left:it.x+'px',top:it.y+'px',width:it.w+'px',height:Math.max(it.h+14,70)+'px',fontSize:it.fontSize+'px',color:it.color,lineHeight:'1.4',transform:it.angle?`rotate(${it.angle}deg)`:''});$('#paper').appendChild(ta);ta.addEventListener('pointerdown',e=>e.stopPropagation());ta.addEventListener('blur',()=>setTimeout(()=>{if(textEdit&&document.activeElement!==ta)commitText()},100));ta.focus()}
function commitText(cancel=false){if(!textEdit)return;const ed=textEdit;const ta=$('#canvasTextEditor');textEdit=null;if(!ta)return;const p=S.pages.find(p=>p.id===ed.pageId);if(!cancel&&p){const it=ed.item;it.text=ta.value;it.w=Math.max(80,ta.offsetWidth-6);const c=$('#ink').getContext('2d');c.font=`${it.fontSize}px sans-serif`;it.h=Math.max(it.fontSize*1.4,wrapText(c,it.text,it.w).length*it.fontSize*1.4);if(it.text.trim()){historyPush(clone(p.items));if(ed.existing){const idx=p.items.findIndex(x=>x.id===it.id);if(idx>=0)p.items[idx]=it}else p.items.push(it);renderInk();markPage()}}ta.remove()}
function renderInspector(){const p=page();if(!p)return;$('#inspectorTabs').innerHTML=[['notes','Notizen'],['learn','Lernen'],['audio','Audio'],['leo','Leo']].map(([v,t])=>`<button data-act="inspector-tab" data-tab="${v}" class="${inspectorTab===v?'active':''}">${t}</button>`).join('');const el=$('#inspectorContent');if(inspectorTab==='notes'){el.innerHTML=`<div class="row between"><span class="label">SEITENWISSEN</span>${icon('pen',true)}</div><h3 style="margin-top:20px">Was bleibt hängen?</h3><p>Deine Gedanken zum Skript. Durchsuchbar und mit dieser Seite verknüpft.</p><textarea id="pageNotes" placeholder="Kernaussagen, offene Fragen, Zusammenhänge …">${esc(p.notes)}</textarea><p style="margin-top:11px;font-size:10px">Wird automatisch lokal gespeichert.</p><div class="divider"></div><h3>Dein Papier</h3><select id="pageTemplate" style="margin-top:10px" ${p.backgroundId?'disabled':''}>${Object.entries(TEMPLATES).map(([v,t])=>`<option value="${v}" ${p.template===v?'selected':''}>${t}</option>`).join('')}</select><div class="row" style="margin-top:12px"><span class="tiny muted">Papierfarbe</span><input type="color" id="pageColor" value="${p.paperColor||'#fffcf5'}" style="width:34px;height:27px;padding:0" ${p.backgroundId?'disabled':''}></div>${p.pdfText?`<div class="divider"></div><h3>Text aus dem PDF</h3><p style="white-space:pre-wrap;max-height:210px;overflow:auto">${esc(p.pdfText.slice(0,7000))}</p>`:''}<div class="divider"></div><span class="tiny muted">${p.items.length} Elemente · ${p.items.filter(i=>i.points).length} Stiftstriche</span>`}else if(inspectorTab==='learn'){el.innerHTML=`<span class="label">AKTIV ERINNERN</span><h3 style="margin-top:18px">Wissen, das bleibt.</h3><p>Eine klare Frage, eine gute Antwort. Jede Karte behält ihren Bezug zur Seite.</p>${btn('Lernkarte zur Seite','new-card','plus','primary','style="width:100%"')}<div class="divider"></div><h3>Beschriftungen abdecken</h3><p>Ziehe mit dem Band-Werkzeug über die Antwort. Mit der Hand antippen zum Aufdecken.</p>${btn('Abdeckband wählen','choose-tape','tape')}<label class="checkline" style="margin-top:10px"><input type="checkbox" id="revealTape" ${S.settings.revealTape?'checked':''}>Alle Antworten zeigen</label><div class="divider"></div><h3>Karten dieser Seite</h3>${S.cards.filter(c=>c.pageId===p.id).map(c=>`<button class="resource" style="text-align:left;width:100%;margin-top:10px" data-act="edit-card" data-id="${c.id}"><span class="small">${esc(c.front)}</span></button>`).join('')||'<p>Noch keine Lernkarten.</p>'}`}else if(inspectorTab==='audio'){el.innerHTML=`<span class="label">VORLESUNG FESTHALTEN</span><h3 style="margin-top:18px">Ton und Gedanken zusammen.</h3><p>Aufnahmen werden lokal gespeichert. Bitte nur mit erforderlicher Zustimmung aufnehmen. HTTPS und Mikrofonfreigabe sind je nach Browser erforderlich.</p><div class="row wrap">${btn(recorder?'Stoppen':'Aufnehmen','record-toggle',recorder?'stop':'mic',recorder?'':'primary')}${btn('Audio importieren','import-audio','upload')}</div><div id="audioList">${renderAudioItems()}</div>`;hydrateAudio()}else{el.innerHTML=`<div class="row between"><span class="label">DEIN LEO</span><span class="badge">${bridge.capabilities.openclaw?'BEREIT ZUM TEST':'NICHT VERBUNDEN'}</span></div><h3 style="margin-top:18px">Denk gemeinsam weiter.</h3><p>Fragen, Zusammenfassungen oder Lernkarten. Gesendet wird nur der unten ausgewählte Kontext. Kein automatisches Hochladen beim Schreiben.</p><select id="aiScope" aria-label="Kontext für Leo">${[['page','Aktuelle Seite'],['notebook','Dieses Notizbuch'],['all','Gesamter aktiver Notizbestand']].map(([v,t])=>`<option value="${v}" ${S.settings.aiScope===v?'selected':''}>${t}</option>`).join('')}</select><label class="checkline" style="margin-top:12px"><input id="aiImage" type="checkbox" ${S.settings.aiImage?'checked':''}>Aktuelles Seitenbild mitsenden</label><p class="tiny muted">Mit Bild: auch Handschrift und Zeichnungen. Benötigt ein bildfähiges Modell; wird an den konfigurierten Anbieter gesendet.</p><div id="chatMessages">${chatMessages.map(m=>`<div class="chat-message ${m.role}">${esc(m.content)}</div>`).join('')}</div><textarea id="aiPrompt" style="min-height:90px;margin-top:15px" placeholder="Was möchtest du verstehen?"></textarea><div class="row" style="margin-top:10px">${btn('An Leo senden','ask-leo','send','primary')}${ib('link','bridge-login','Bridge einrichten')}</div><div class="row wrap" style="margin-top:15px">${btn('Zusammenfassen','leo-summary','spark','ghost')}${btn('Lernkarten vorschlagen','leo-cards','cards','ghost')}</div>${chatMessages.some(m=>m.role==='assistant')?btn('Letzte Antwort als Seitennotiz','save-leo-answer','plus','', 'style="margin-top:10px;white-space:normal"'):''}<p class="tiny">Antworten sind ungeprüfte KI-Inhalte. OCR und Transkription erfordern passend konfigurierte Modelle; kein lokaler Erkennungsdienst ist eingebaut.</p>`}}

function newBookDialog(editId){const b=S.notebooks.find(b=>b.id===editId);chosenColor=b?.color||COLORS[S.notebooks.length%COLORS.length];chosenTemplate=S.settings.defaultTemplate;formModal(b?'Notizbuch bearbeiten':'Ein neues Kapitel',`<div class="field"><label for="bookTitle">Wie heißt dein Notizbuch?</label><input id="bookTitle" name="title" required maxlength="140" placeholder="Zum Beispiel: Bewegungslehre" value="${esc(b?.title||'')}"></div><div class="field"><label for="bookFolder">Fach</label><select name="folder" id="bookFolder">${folderOptions(b?.folderId||folderFilter)}</select></div><div class="field"><label>Einband</label><div class="color-choices">${COLORS.map(c=>`<button type="button" class="color-choice ${chosenColor===c?'active':''}" style="background:${c}" data-act="cover-color" data-color="${c}" aria-label="Einband ${c}"></button>`).join('')}</div></div>${!b?`<div class="field"><label>Papier</label><div class="template-choices">${Object.entries(TEMPLATES).map(([v,t])=>`<button type="button" class="template-choice ${chosenTemplate===v?'active':''}" data-act="template-choice" data-template="${v}">${icon(['dots','grid','lined','blank','cornell'].includes(v)?(v==='lined'?'lines':v):'file')}${t}</button>`).join('')}</div></div>`:''}<div class="field"><label for="bookTags">Tags · durch Komma trennen</label><input id="bookTags" name="tags" value="${esc(b?.tags?.join(', ')||'')}" placeholder="Prüfung, Semester 1, wichtig"></div>`,async fd=>{const title=String(fd.get('title')).trim();if(!title)return;const tags=String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,20);if(b){b.title=title;b.folderId=fd.get('folder');b.tags=tags;b.color=chosenColor;b.updated=Date.now();changed(false);closeModal();renderShell();renderView();if(currentBook)renderEditorTop()}else{const nb={id:uid(),title,folderId:fd.get('folder'),color:chosenColor,tags,created:Date.now(),updated:Date.now(),deleted:false,favorite:false};const p=makePage(nb.id,chosenTemplate);S.notebooks.push(nb);S.pages.push(p);changed(false);closeModal();renderShell();await openBook(nb.id)}},b?'Änderungen speichern':'Notizbuch öffnen')}
function bookMenu(id=currentBook){const b=S.notebooks.find(b=>b.id===id);if(!b)return;modal(b.title,`<div class="stack">${btn('Titel, Einband & Fach bearbeiten','edit-book','edit','',`data-id="${id}"`)}${btn(b.favorite?'Aus Favoriten entfernen':'Zu Favoriten hinzufügen','favorite-book','star','',`data-id="${id}"`)}${btn('Notizbuch duplizieren','duplicate-book','copy','',`data-id="${id}"`)}${btn('Als PDF exportieren','export-book','download','',`data-id="${id}"`)}${btn('In den Papierkorb','trash-book','trash','danger',`data-id="${id}"`)}</div>`)}
function newFolderDialog(editId){const f=S.folders.find(f=>f.id===editId);formModal(f?'Fach bearbeiten':'Dein neues Fach',`<div class="field"><label for="folderName">Name</label><input id="folderName" name="name" maxlength="120" value="${esc(f?.name||'')}" placeholder="Zum Beispiel: Neurologie" required></div><div class="field"><label for="folderColor">Farbe</label><input type="color" id="folderColor" name="color" value="${f?.color||'#a6ba98'}"></div>${f?btn('Fach entfernen · Notizbücher behalten','delete-folder','trash','danger',`data-id="${f.id}" type="button"`):''}`,fd=>{if(f){f.name=fd.get('name').trim();f.color=fd.get('color')}else S.folders.push({id:uid(),name:fd.get('name').trim(),color:fd.get('color')});changed(false);closeModal();renderShell();renderView()})}

function duplicateBook(id){const old=S.notebooks.find(b=>b.id===id),b=clone(old);b.id=uid();b.title+=' · Kopie';b.created=b.updated=Date.now();S.notebooks.push(b);for(const p of pagesFor(id)){const cp=clone(p);cp.id=uid();cp.notebookId=b.id;cp.items.forEach(i=>i.id=uid());S.pages.push(cp)}changed(false);closeModal();renderView();toast('Notizbuch dupliziert. Anhänge werden platzsparend gemeinsam verwendet.')}
function taskDialog(){formModal('Ein kleiner nächster Schritt',`<div class="field"><label for="taskTitle">Aufgabe oder Abgabe</label><input name="title" id="taskTitle" required maxlength="400" placeholder="Was möchtest du schaffen?"></div><div class="field"><label for="taskDue">Fällig am · optional</label><input type="date" name="due" id="taskDue"></div>`,fd=>{S.tasks.push({id:uid(),title:fd.get('title').trim(),due:fd.get('due')||'',done:false,created:Date.now()});changed(false);closeModal();renderView()})}
function eventDialog(){formModal('Termin eintragen',`<div class="field"><label for="eventTitle">Titel</label><input name="title" id="eventTitle" required maxlength="300" placeholder="Vorlesung, Lerngruppe, Prüfung …"></div><div class="two-col"><div class="field"><label>Datum</label><input type="date" name="date" value="${dateInput()}" required></div><div class="field"><label>Uhrzeit · Europe/Vienna</label><input type="time" name="time" value="09:00" required></div></div><div class="field"><label>Dauer in Minuten</label><input type="number" name="duration" value="90" min="5" max="1440"></div><div class="field"><label>Ort · optional</label><input name="location" maxlength="200"></div>`,fd=>{const start=parseCalendarTime(fd.get('date').replaceAll('-','')+'T'+fd.get('time').replace(':','')+'00','Europe/Vienna');S.events.push({id:uid(),title:fd.get('title').trim(),start,end:start+Number(fd.get('duration'))*60000,location:fd.get('location'),source:'Persönlich'});changed(false);closeModal();renderView()})}
function cardDialog(editId){const c=S.cards.find(c=>c.id===editId);formModal(c?'Lernkarte bearbeiten':'Ein Gedanke, der bleibt',`<div class="field"><label for="cardFront">Frage / Vorderseite</label><textarea id="cardFront" name="front" required rows="3" maxlength="5000" placeholder="Was möchtest du aktiv erinnern?">${esc(c?.front||'')}</textarea></div><div class="field"><label for="cardBack">Antwort / Rückseite</label><textarea id="cardBack" name="back" required rows="5" maxlength="20000" placeholder="Die Antwort in deinen Worten …">${esc(c?.back||'')}</textarea></div><div class="small muted">${currentPage?'Mit der aktuellen Seite verknüpft.':'Freie Lernkarte.'} Keine automatische fachliche Prüfung.</div>`,fd=>{if(c){c.front=fd.get('front').trim();c.back=fd.get('back').trim()}else S.cards.push({id:uid(),front:fd.get('front').trim(),back:fd.get('back').trim(),notebookId:currentBook,pageId:currentPage,due:Date.now(),interval:0,ease:2.5,reviews:0,created:Date.now()});changed(false);closeModal();if(currentPage)renderInspector();else renderView()})}
function startReview(all=false){reviewCards=S.cards.filter(c=>(all||c.due<=Date.now())&&(!c.notebookId||S.notebooks.some(b=>b.id===c.notebookId&&!b.deleted))).map(c=>c.id);reviewIndex=0;reviewShow=false;showReview()}
function showReview(){if(reviewIndex>=reviewCards.length){modal('Gut gemacht.',`<div style="text-align:center;padding:20px"><div style="font:64px var(--serif)">${reviewCards.length}</div><h3>Karten wiederholt.</h3><p class="muted small" style="margin:10px 0 25px">Die nächsten Wiederholungen sind eingeplant.</p>${btn('Zurück zum Lernraum','close-review','check','primary')}</div>`);return}const c=S.cards.find(x=>x.id===reviewCards[reviewIndex]);if(!c){reviewIndex++;showReview();return}modal(`Deine Lernrunde · ${reviewIndex+1} / ${reviewCards.length}`,`<div class="progressbar" style="margin-bottom:20px"><div style="width:${reviewIndex/reviewCards.length*100}%"></div></div><button class="flashcard" style="width:100%" data-act="flip-card"><span class="label">${reviewShow?'FRAGE & ANTWORT':'DENK KURZ NACH'}</span><div class="question" style="margin-top:20px">${esc(c.front)}</div>${reviewShow?`<div class="divider" style="width:70px"></div><div class="answer">${esc(c.back)}</div>`:`<span class="tiny muted" style="margin-top:30px">Antippen, um die Antwort zu zeigen</span>`}</button>${reviewShow?`<div class="rating-buttons">${[['again','Nochmal'],['hard','Schwer'],['good','Gut'],['easy','Leicht']].map(([v,t])=>btn(t,'rate-card','',v==='good'?'primary':'',`data-rating="${v}"`)).join('')}</div>`:btn('Antwort zeigen','flip-card','eye','primary','style="display:flex;margin:20px auto 0"')}<p class="tiny muted" style="text-align:center;margin-top:15px">${esc(S.notebooks.find(b=>b.id===c.notebookId)?.title||'Freie Lernkarte')}</p>`)}
function rateCard(rating){const c=S.cards.find(c=>c.id===reviewCards[reviewIndex]);const old=c.interval||0;if(rating==='again'){c.interval=0;c.due=Date.now()+60000;c.ease=Math.max(1.3,(c.ease||2.5)-.2)}else{c.interval=rating==='hard'?Math.max(1,Math.round(old*1.2)):rating==='good'?(old?Math.max(2,Math.round(old*(c.ease||2.5))):1):(old?Math.max(4,Math.round(old*(c.ease||2.5)*1.3)):4);if(rating==='easy')c.ease=(c.ease||2.5)+.15;c.due=Date.now()+c.interval*86400000}c.reviews=(c.reviews||0)+1;c.lastReview=Date.now();changed(false);reviewIndex++;reviewShow=false;showReview()}
function focusToggle(){if(focusEnd){focusSeconds=Math.max(0,Math.ceil((focusEnd-Date.now())/1000));focusEnd=0;clearInterval(focusInterval)}else{focusEnd=Date.now()+Math.max(focusSeconds,1)*1000;focusInterval=setInterval(()=>{const n=Math.ceil((focusEnd-Date.now())/1000);$$('[data-focus-clock]').forEach(e=>e.textContent=timeLabel(n));if(n<=0){focusEnd=0;focusSeconds=25*60;clearInterval(focusInterval);toast('Fokuszeit geschafft. Zeit für eine kurze Pause.');if(view==='home')renderView()}},500)}if(view==='home')renderView()}
function searchDialog(){modal('Ein Gedanke ist nie weit weg.',`<input type="search" class="searchbox" id="globalSearch" placeholder="Notizbücher, Tags, Seitennotizen, PDF-Text …" autocomplete="off"><p class="tiny muted" style="margin:10px 0">Stiftstriche sind ohne OCR nicht als Text durchsuchbar.</p><div id="searchResults"></div>`,true);setTimeout(()=>$('#globalSearch')?.focus(),60);runSearch('')}
function runSearch(query){const q=query.toLocaleLowerCase('de').trim();let out='';const bs=S.notebooks.filter(b=>!b.deleted);for(const b of bs){if(!q||[b.title,...(b.tags||[])].join(' ').toLocaleLowerCase('de').includes(q))out+=`<button class="search-result" data-act="search-open" data-id="${b.id}">${icon('book')}<span><strong>${esc(b.title)}</strong><small>Notizbuch · ${pagesFor(b.id).length} Seiten</small></span></button>`;if(q)for(const [i,p]of pagesFor(b.id).entries()){const text=[p.notes,p.pdfText,...p.items.filter(i=>i.type==='text').map(i=>i.text)].join('\n');const at=text.toLocaleLowerCase('de').indexOf(q);if(at>=0)out+=`<button class="search-result" data-act="search-open" data-id="${b.id}" data-page="${p.id}">${icon('file')}<span><strong>${esc(b.title)} · Seite ${i+1}</strong><small>${esc(text.slice(Math.max(0,at-45),at+130))}</small></span></button>`}}$('#searchResults').innerHTML=out||empty('Noch kein Treffer','Probiere einen anderen Suchbegriff.','','','search')}
function helpDialog(){modal('Dein Raum. Schnell vertraut.',`<div class="hint">Auf dem iPad: Stift schreibt, Finger verschiebt; mit zwei Fingern zoomen. Bei Handballenproblemen „Nur Stift + Maus“ aktivieren. Für die tägliche Nutzung als Safari-Web-App über die private HTTPS-Bridge öffnen, nicht in einer Dateivorschau.</div><h3 style="margin-top:22px">Tastenkürzel</h3>${[['Suchen','⌘ / Strg K'],['Rückgängig / Wiederholen','⌘ Z / ⌘ ⇧ Z'],['Kopieren / Einfügen im Lasso','⌘ C / ⌘ V'],['Alles auswählen','⌘ A'],['Auswahl löschen','Entf / Backspace'],['Stift / Marker / Radierer','P / H / E'],['Lasso / Text / Form / Hand','L / T / S / V'],['Kurz verschieben','Leertaste halten'],['Zoomen','⌘ / Strg + Mausrad'],['Text übernehmen','⌘ / Strg + Enter'],['Dialog schließen / Abbrechen','Escape']].map(([a,b])=>`<div class="shortcut"><span>${a}</span><kbd class="kbd">${b}</kbd></div>`).join('')}<h3 style="margin-top:22px">Wichtig zu Dateien und Daten</h3><p class="small muted" style="line-height:1.9;margin-top:9px">PDF-Import rendert Seiten als hochwertige Hintergründe; die Originaldatei bleibt im Backup erhalten. PDF-Export ist gerastert und enthält keine editierbaren Ebenen. Abdeckband ist eine Lernhilfe, keine sichere Schwärzung. Office- und .goodnotes-Dateien werden nicht unterstützt. Audio hängt von Browser, Mikrofonfreigabe und sicherem Kontext ab.</p><p class="small muted" style="line-height:1.9;margin-top:9px">Der HTML-Kern funktioniert ohne Internet. Für PDF-Import wird PDF.js beim ersten Einsatz geladen; importierte Seiten bleiben danach offline verfügbar. Das Workspace-Paket kann den PDF-Renderer vollständig einbetten. Backups regelmäßig außerhalb des Browsers sichern.</p>`,true)}
function pickFiles(accept,target='library'){importTarget=target;const input=$('#fileInput');input.accept=accept;input.multiple=!['backup','ics'].includes(target);input.value='';input.click()}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function safeFilename(n){return String(n).replace(/[\\/:*?"<>|\x00-\x1f]/g,'-').slice(0,120)||'Leo'}
function setProgress(title,percent,text=''){if(!$('#progressFill'))modal(title,`<p id="progressText" class="small muted" style="margin-bottom:17px">${esc(text)}</p><div class="progressbar"><div id="progressFill" style="width:0"></div></div><p class="tiny muted" style="margin-top:13px">Andere Dateien erst nach Abschluss importieren. Die Verarbeitung erfolgt in dieser geöffneten App.</p>`);$('#progressFill').style.width=clamp(percent,0,100)+'%';$('#progressText').textContent=text}
async function backup(){commitText();await flush();setProgress('Dein Wissen sichern',5,'Notizen und Anhänge werden zusammengestellt.');try{S.settings.backupAt=Date.now();const state=clone(S);state.settings.bridgeUrl='';const assets=await dbAll('assets'),out=[];for(let i=0;i<assets.length;i++){const a=assets[i];out.push({...a,data:typeof a.data==='string'?a.data:await toBase64(a.data)});setProgress('Dein Wissen sichern',10+75*(i+1)/Math.max(1,assets.length),`Anhang ${i+1} von ${assets.length}`)}let blob=new Blob([JSON.stringify({format:'folio-backup',version:1,exportedAt:new Date().toISOString(),state,assets:out})],{type:'application/json'});if(typeof CompressionStream==='function')blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();downloadBlob(blob,`Leo-Backup-${dateInput()}.folio`);closeModal();changed(false);toast('Vollständiges Backup exportiert. Bewahre es außerhalb des Browsers auf.')}catch(e){closeModal();toast('Backup fehlgeschlagen: '+e.message,true)}}
function validateState(raw){if(!raw||raw.schema!=='folio/1')throw Error('Unbekanntes Datenformat. Erwartet: folio/1.');if(!Array.isArray(raw.notebooks)||!Array.isArray(raw.pages))throw Error('Notizbuch- oder Seitenliste fehlt.');if(raw.pages.length>10000||raw.notebooks.length>2000)throw Error('Dieser Bestand überschreitet die Importgrenzen.');const s=clone(raw);for(const name of ['folders','cards','tasks','events','resources','recordings'])if(!Array.isArray(s[name]))s[name]=[];s.settings={...defaultSettings(),...(s.settings||{})};s.settings.autoSync=false;s.settings.bridgeUrl='';const idOK=id=>typeof id==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(id),colorOK=c=>/^#[a-fA-F0-9]{6}$/.test(c||'');const allids=new Set();for(const n of s.notebooks){if(!idOK(n.id)||allids.has(n.id))throw Error('Ungültige oder doppelte Notizbuch-ID');allids.add(n.id);n.title=String(n.title||'Notizbuch').slice(0,500);n.tags=Array.isArray(n.tags)?n.tags.map(String).slice(0,30):[];if(!colorOK(n.color))n.color=COLORS[0];n.created=Number(n.created)||Date.now();n.updated=Number(n.updated)||Date.now()}const pageids=new Set();for(const p of s.pages){if(!idOK(p.id)||pageids.has(p.id)||!allids.has(p.notebookId))throw Error('Ungültige Seitenreferenz');pageids.add(p.id);if(!Number.isFinite(p.width)||p.width<100||p.width>3000||!Number.isFinite(p.height)||p.height<100||p.height>10000)throw Error('Ungültige Seitengröße');if(!Array.isArray(p.items)||p.items.length>50000)throw Error('Zu viele oder ungültige Seitenelemente');p.notes=String(p.notes||'').slice(0,1000000);p.pdfText=String(p.pdfText||'').slice(0,1000000);if(!colorOK(p.paperColor))p.paperColor='#fffcf5';if(p.thumb&&!/^data:image\/(jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(p.thumb))delete p.thumb;for(const it of p.items){if(!idOK(it.id)||!['pen','highlight','shape','text','image','tape'].includes(it.type))throw Error('Ungültiges Seitenelement');if(!colorOK(it.color))it.color='#294638';if(it.points){if(!Array.isArray(it.points)||it.points.length>250000)throw Error('Ungültige Strichdaten');for(const pt of it.points)if(!Array.isArray(pt)||pt.length<3||!pt.slice(0,3).every(Number.isFinite))throw Error('Ungültiger Strichpunkt')}else if(!['x','y','w','h'].every(k=>Number.isFinite(it[k])))throw Error('Ungültige Elementkoordinaten');if(it.type==='text'){it.text=String(it.text||'');it.fontSize=clamp(Number(it.fontSize)||22,6,500)}it.width=clamp(Number(it.width)||2.5,.1,100)}}for(const f of s.folders){if(!idOK(f.id))throw Error('Ungültige Fach-ID');f.name=String(f.name||'Fach').slice(0,150);if(!colorOK(f.color))f.color='#a6ba98'}for(const name of ['cards','tasks','events','recordings','resources'])for(const item of s[name])if(!idOK(item.id))throw Error('Ungültige ID in '+name);return s}
async function parseBackup(file){if(file.size>250*1024*1024)throw Error('Backup ist größer als 250 MB. Nutze dafür den Workspace-Import.');let data=await file.arrayBuffer();const bytes=new Uint8Array(data);if(bytes[0]===31&&bytes[1]===139){if(typeof DecompressionStream!=='function')throw Error('Dieser Browser kann komprimierte Backups nicht lesen. Bitte aktuellen Safari/Chrome verwenden.');data=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();if(data.byteLength>512*1024*1024)throw Error('Entpacktes Backup ist zu groß.')}const out=JSON.parse(new TextDecoder().decode(data));if(out.format!=='folio-backup'||out.version!==1)throw Error('Keine gültige Leo-Sicherung.');out.state=validateState(out.state);if(!Array.isArray(out.assets))throw Error('Anhangsliste fehlt.');const aid=new Set();for(const a of out.assets){if(!/^[A-Za-z0-9_-]{1,100}$/.test(a.id)||aid.has(a.id)||typeof a.data!=='string'||!/^[A-Za-z0-9+/=\r\n]*$/.test(a.data))throw Error('Ungültige oder doppelte Anhangsdaten');aid.add(a.id)}return out}
async function importBackup(file){const out=await parseBackup(file);pendingImport=out;modal('Deinen Lernraum mitbringen',`<div class="hint"><strong>${out.state.notebooks.length} Notizbücher · ${out.state.pages.length} Seiten · ${out.assets.length} Anhänge</strong><br>Exportiert am ${esc(out.exportedAt||'unbekannt')}</div><p class="small muted" style="margin:18px 0;line-height:1.8">„Zusammenführen“ fügt die importierten Notizen mit neuen IDs hinzu und lässt bestehende Notizen unverändert. „Ersetzen“ tauscht den lokalen Bestand aus; exportiere vorher ein Backup.</p><div class="stack">${btn('Sicher zusammenführen','apply-backup-merge','plus','primary')}${btn('Aktuellen Bestand ersetzen','apply-backup-replace','restore','danger')}${btn('Zuerst aktuelles Backup sichern','backup','download')}</div>`)}
async function applyBackup(merge){const out=pendingImport;if(!out)return;if(!merge&&!confirm('Lokalen Bestand vollständig ersetzen? Nicht gesicherte lokale Notizen gehen verloren.'))return;setProgress('Lernraum übernehmen',5,'Anhänge werden importiert.');const ns=clone(out.state),mapping=new Map();if(merge){for(const name of ['notebooks','pages','folders','cards','tasks','events','resources','recordings'])for(const item of ns[name])mapping.set(item.id,uid());for(const a of out.assets)mapping.set(a.id,uid());const remap=v=>mapping.get(v)||v;for(const b of ns.notebooks){b.id=remap(b.id);b.folderId=remap(b.folderId)}for(const p of ns.pages){p.id=remap(p.id);p.notebookId=remap(p.notebookId);for(const k of ['backgroundId','pdfId'])if(p[k])p[k]=remap(p[k]);for(const it of p.items){it.id=uid();if(it.assetId)it.assetId=remap(it.assetId);if(it.audioId)it.audioId=remap(it.audioId)}}for(const f of ns.folders){f.id=remap(f.id);if(f.parentId)f.parentId=remap(f.parentId);}for(const name of ['cards','tasks','events','resources','recordings'])for(const item of ns[name]){item.id=remap(item.id);for(const k of ['notebookId','pageId','folderId','assetId','parentId'])if(item[k])item[k]=remap(item[k]);if(item.markers)for(const m of item.markers)m.pageId=remap(m.pageId);if(item.chunkIds)item.chunkIds=item.chunkIds.map(remap)}}for(let i=0;i<out.assets.length;i++){const a=out.assets[i];await dbPut('assets',merge?mapping.get(a.id):a.id,{...a,id:merge?mapping.get(a.id):a.id,data:fromBase64(a.data)});setProgress('Lernraum übernehmen',5+90*(i+1)/Math.max(1,out.assets.length),`Anhang ${i+1} von ${out.assets.length}`)}if(merge){for(const name of ['notebooks','pages','folders','cards','tasks','events','resources','recordings'])S[name].push(...ns[name])}else S=ns;pendingImport=null;changed(false);await flush();closeModal();if(currentBook)closeEditor();applyTheme();navigate('library');toast('Backup erfolgreich übernommen.')}
async function importFiles(files,target=importTarget){if(importBusy){toast('Ein Import läuft bereits.');return}importBusy=true;try{for(const file of files){const ext=file.name.toLowerCase().split('.').pop();if(['folio','json'].includes(ext)||target==='backup'){await importBackup(file);break}else if(ext==='ics'||target==='ics'){await importICS(await file.text(),'ICS-Import');}else if(file.type==='application/pdf'||ext==='pdf'){await importPDF(file,target==='append');}else if(file.type.startsWith('image/')){await importImage(file,target==='image'||target==='append');}else if(file.type.startsWith('audio/')||['m4a','mp3','wav','ogg','webm'].includes(ext)){await importAudio(file);}else if(['txt','md'].includes(ext)){await importTextFile(file,target==='append');}else toast('Dateityp nicht unterstützt: '+file.name+'. Nutze PDF, Bild, Audio, Text, ICS oder Leo-Backup.',true)}}catch(e){closeModal();toast('Import fehlgeschlagen: '+e.message,true);console.warn(e)}finally{importBusy=false;$('#fileInput').value=''}}
async function importImage(file,intoPage=false){if(file.size>40*1024*1024)throw Error('Bild ist größer als 40 MB.');const rawId=await addAsset(file,'image');const im=await loadImage(rawId);let id=rawId;if(im.width>2600||im.height>2600){const c=document.createElement('canvas'),factor=Math.min(2600/im.width,2600/im.height);c.width=Math.round(im.width*factor);c.height=Math.round(im.height*factor);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,file.type==='image/png'?'image/png':'image/jpeg',.9));id=await addAsset(blob,'image');await dbDel('assets',rawId);imageCache.delete(rawId)}if(intoPage&&page()){const p=page(),factor=Math.min(500/im.width,(p.height*.55)/im.height);historyPush();const it={id:uid(),type:'image',assetId:id,x:Math.max(25,(p.width-im.width*factor)/2),y:Math.max(25,Math.min(p.height-im.height*factor-25,150)),w:im.width*factor,h:im.height*factor};p.items.push(it);tool='lasso';selected=new Set([it.id]);renderToolbar();renderSelection();await renderInk();markPage();toast('Bild eingefügt. Mit Lasso verschieben, skalieren oder drehen.')}else{const b={id:uid(),title:file.name.replace(/\.[^.]+$/,''),folderId:folderFilter,color:COLORS[3],tags:[],favorite:false,deleted:false,created:Date.now(),updated:Date.now()};const p=makePage(b.id,'blank');p.height=Math.round(794*im.height/im.width);p.backgroundId=id;p.paperColor='#ffffff';S.notebooks.push(b);S.pages.push(p);changed(false);await openBook(b.id)}}
async function importTextFile(file,append){if(file.size>4*1024*1024)throw Error('Textdatei zu groß.');const text=await file.text(),bid=append&&book()?currentBook:uid();if(bid!==currentBook)S.notebooks.push({id:bid,title:file.name.replace(/\.[^.]+$/,''),folderId:folderFilter,color:COLORS[4],tags:[],favorite:false,deleted:false,created:Date.now(),updated:Date.now()});const p=makePage(bid,'lined');p.order=pagesFor(bid).length;p.notes=text;p.items.push({id:uid(),type:'text',x:50,y:60,w:680,h:900,fontSize:17,text:text.slice(0,2600),color:'#294638'});S.pages.push(p);changed(false);await openBook(bid,p.id);toast(text.length>2600?'Text importiert. Vollständiger Inhalt in den Seitennotizen.':'Text importiert.')}

async function api(path,options={}){if(staticDemo)throw Error('Die öffentliche Leo-Demo verbindet sich nicht mit deiner privaten Bridge. Öffne dafür deine private Tailscale-Adresse.');if(!/^https?:$/.test(location.protocol))throw Error('Die private Verbindung benötigt die über deinen Server geöffnete Leo-App. Eine file://-Datei kann keine sichere Same-Origin-Sitzung einrichten.');const {raw=false,rawBody=false,body,headers={},...rest}=options;const h={'X-Folio-Request':'1',...headers};if(body!==undefined&&!rawBody)h['Content-Type']='application/json';const r=await fetch('/api/v1'+path,{...rest,headers:h,credentials:'same-origin',body:body===undefined?undefined:rawBody?body:JSON.stringify(body)});if(!r.ok){let msg;try{msg=(await r.json()).error}catch{msg=await r.text().catch(()=>r.statusText)}const e=Error(msg||'Serverfehler '+r.status);e.status=r.status;throw e}return raw?r:r.status===204?{}:r.json()}
async function checkBridge(){if(staticDemo||!/^https?:$/.test(location.protocol))return;try{const info=await api('/session');if(!info.authenticated)return;bridge.connected=true;bridge.capabilities=info.capabilities||{};bridge.serverId=info.serverId;const meta=await dbGet('kv','bridge-meta');if(meta?.serverId===info.serverId){bridge.revision=meta.revision;bridge.lastSync=meta.lastSync}renderShell();if(view==='connections'||view==='settings'||view==='home')renderView()}catch{}}
function bridgeLogin(){if(staticDemo){modal('Private Leo-Bridge','<div class="hint warning"><strong>Öffentliche Demo.</strong> Die private Bridge ist auf GitHub Pages absichtlich deaktiviert. Öffne für Leo, Moodle, Levis und Synchronisierung deine private Tailscale-Adresse.</div>');return}if(!/^https?:$/.test(location.protocol)){formModal('Deinen privaten Lernraum öffnen',`<div class="hint warning" style="margin-bottom:20px">Diese HTML-Datei läuft lokal. Für Leo, Mikrofon und mehrere Geräte richte das beiliegende Workspace-Paket auf deinem Server ein und öffne dessen HTTPS-Adresse. Vorhandene lokale Notizen vorher exportieren und dort wieder importieren.</div><div class="field"><label>Adresse deiner eingerichteten Leo-App</label><input type="url" name="url" value="${esc(S.settings.bridgeUrl||'')}" placeholder="https://dein-leo-server.ts.net/" required></div><p class="tiny muted">Hier keinen OpenClaw-Gateway-Token eingeben. Die Bridge verwendet einen getrennten Leo-Zugangscode.</p>`,fd=>{const u=new URL(fd.get('url'));if(!['https:','http:'].includes(u.protocol))throw Error('Nur HTTP(S)-Adressen sind erlaubt.');S.settings.bridgeUrl=u.origin;changed(false);window.open(u.href,'_blank','noopener,noreferrer');closeModal()},'Private App öffnen');return}formModal('Private Bridge verbinden',`<div class="hint" style="margin-bottom:20px">Server: ${esc(location.origin)}<br>Verwende den Leo-Zugangscode aus der Servereinrichtung, <strong>nicht</strong> deinen OpenClaw-Gateway-Schlüssel.</div><div class="field"><label for="bridgePassword">Leo-Zugangscode</label><input type="password" name="password" id="bridgePassword" required autocomplete="current-password"></div><p class="tiny muted">Sitzung als HttpOnly-Cookie. Kein Passwort im HTML, Local Storage oder Backup.</p>`,async fd=>{const info=await api('/session',{method:'POST',body:{password:fd.get('password')}});bridge.connected=true;bridge.capabilities=info.capabilities||{};bridge.serverId=info.serverId;closeModal();await checkBridge();toast('Mit deiner privaten Leo-Bridge verbunden. Dienste separat testen.');if(currentBook)renderInspector()},'Verbinden')}
function referencedAssets(state=S){const ids=new Set;for(const p of state.pages){if(p.backgroundId)ids.add(p.backgroundId);if(p.pdfId)ids.add(p.pdfId);for(const it of p.items)if(it.assetId)ids.add(it.assetId)}for(const r of state.recordings){if(r.assetId)ids.add(r.assetId);for(const id of r.chunkIds||[])ids.add(id)}return ids}
let syncRemote=null,syncBusy=false;
async function syncDialog(){if(!bridge.connected){bridgeLogin();return}try{syncRemote=await api('/state');const n=syncRemote.state?.notebooks?.filter(b=>!b.deleted).length||0;modal('Welcher Bestand soll übernommen werden?',`<div class="hint"><strong>Dieses Gerät:</strong> ${S.notebooks.filter(b=>!b.deleted).length} aktive Notizbücher<br><strong>Privater Server:</strong> ${n} aktive Notizbücher · Revision ${syncRemote.revision}</div><p class="small muted" style="margin:18px 0;line-height:1.85">Ein Abgleich ersetzt den Zielbestand, er führt parallele Bearbeitungen nicht automatisch zusammen. Der Server legt vor Änderungen eine Version an. Sichere wichtige lokale Änderungen zuerst als Backup.</p><label class="checkline"><input type="checkbox" id="syncConsent">Gesamten Leo-Bestand einschließlich Anhängen für meine private Bridge freigeben</label><div class="stack" style="margin-top:20px">${btn('Dieses Gerät → privater Server','sync-upload','upload','primary')}${btn('Privater Server → dieses Gerät','sync-download','download','',syncRemote.state?'':'disabled')}${btn('Zuerst Backup sichern','backup','shield')}</div><p class="tiny muted" style="margin-top:17px">Der separate Agent-Schlüssel kann nach Serverkonfiguration alle synchronisierten Leo-Daten lesen. Schreibrechte werden serverseitig getrennt aktiviert.</p>`)}catch(e){toast(e.message,true)}}
async function uploadState(expectedRevision,quiet=false){if(syncBusy)return;syncBusy=true;try{commitText();await flush();const snap=clone(S),version=S.updated;delete snap.settings.bridgeUrl;const remote=await api('/assets'),known=new Set(remote.assets||[]),ids=[...referencedAssets(snap)];if(!quiet)setProgress('Privat synchronisieren',3,'Anhänge werden abgeglichen.');for(let i=0;i<ids.length;i++){if(!known.has(ids[i])){const a=await getAsset(ids[i]);await api('/assets/'+encodeURIComponent(a.id),{method:'PUT',body:new Blob([a.data],{type:a.mime}),rawBody:true,headers:{'Content-Type':a.mime||'application/octet-stream'}})}if(!quiet)setProgress('Privat synchronisieren',5+85*(i+1)/Math.max(1,ids.length),`Anhang ${i+1} von ${ids.length}`)}const out=await api('/state',{method:'PUT',body:{state:snap},headers:{'If-Match':String(expectedRevision)}});bridge.revision=out.revision;bridge.lastSync=Date.now();pendingChanges=S.updated!==version;await dbPut('kv','bridge-meta',{serverId:bridge.serverId,revision:bridge.revision,lastSync:bridge.lastSync});if(!quiet){closeModal();toast('Bestand auf privatem Server gespeichert. Leo-Zugriff ist separat konfigurierbar.')}}catch(e){if(e.status===409){S.settings.autoSync=false;changed(false);toast('Synchronisierung angehalten: Der Server wurde anderswo geändert. Beide Bestände bleiben erhalten. Bitte manuell abgleichen.',true)}else toast('Synchronisierung fehlgeschlagen: '+e.message,true);if(!quiet)closeModal()}finally{syncBusy=false}}
async function downloadState(){if(!syncRemote?.state)return;if(!confirm('Lokale Notizen durch den Serverbestand ersetzen? Bitte ungesicherte lokale Änderungen vorher als Backup exportieren.'))return;setProgress('Privaten Bestand übernehmen',5,'Serverversion wird geprüft.');try{const remote=await api('/state');if(remote.revision!==syncRemote.revision)throw Error('Serverbestand hat sich verändert. Bitte Abgleich neu öffnen.');const ns=validateState(remote.state),ids=[...referencedAssets(ns)];for(let i=0;i<ids.length;i++){await getAsset(ids[i]);setProgress('Privaten Bestand übernehmen',5+88*(i+1)/Math.max(1,ids.length),`Anhang ${i+1} von ${ids.length}`)}await dbPut('kv','recovery-before-sync',clone(S));S=ns;bridge.revision=remote.revision;bridge.lastSync=Date.now();await dbPut('kv','bridge-meta',{serverId:bridge.serverId,revision:bridge.revision,lastSync:bridge.lastSync});changed(false);await flush();pendingChanges=false;closeModal();if(currentBook)closeEditor();applyTheme();navigate('library');toast('Privater Bestand auf diesem Gerät übernommen.')}catch(e){closeModal();toast(e.message,true)}}
async function moodleSync(){if(!bridge.connected){bridgeLogin();return}setProgress('Moodle-Kurse abrufen',20,'Der Server prüft Token und erlaubte Moodle-Funktionen.');try{const data=await api('/moodle/sync',{method:'POST',body:{}});for(const course of data.courses||[]){const id='moodle-'+course.id;let f=S.folders.find(f=>f.id===id);if(!f)S.folders.push({id,name:course.name,color:COLORS[Number(course.id)%COLORS.length],source:'moodle',courseId:course.id});else f.name=course.name}const rs=new Map(S.resources.map(x=>[x.id,x]));for(const r of data.resources||[])rs.set(r.id,r);S.resources=[...rs.values()];const ts=new Map(S.tasks.map(t=>[t.id,t]));for(const t of data.tasks||[]){const old=ts.get(t.id);ts.set(t.id,{...t,done:old?.done||false})}S.tasks=[...ts.values()];changed(false);closeModal();navigate('library');modal('Moodle-Abgleich abgeschlossen',`<div class="hint"><strong>${data.courses?.length||0} Kurse · ${data.resources?.length||0} Materialien · ${data.tasks?.length||0} Abgabetermine</strong><br>Materialien findest du in den übernommenen Fachordnern. Dateien werden erst beim Import heruntergeladen.</div>${data.warnings?.length?`<div class="hint warning" style="margin-top:15px">${esc(data.warnings.join('\n'))}</div>`:''}<div class="modal-actions">${btn('Zu meinen Fächern','close-modal','check','primary')}</div>`)}catch(e){closeModal();toast('Moodle: '+e.message,true)}}
async function importResource(id){const r=S.resources.find(r=>r.id===id);if(!r)return;try{toast('Kursdatei wird über deine private Bridge geladen.');const res=await api('/moodle/file?url='+encodeURIComponent(r.url),{raw:true});const blob=await res.blob(),file=new File([blob],r.name,{type:blob.type});folderFilter=r.folderId;await importFiles([file],'library')}catch(e){toast('Kursdatei konnte nicht importiert werden: '+e.message,true)}}

 Aufgabe</label><select id="leoTaskParent" name="parentId"><option value="">Eigenständige Aufgabe</option>${options.map(x=>`<option value="${safe(x.id)}" ${draft.parentId===x.id?'selected':''}>${safe(x.title)}</option>`).join('')}</select></div><div class="field"><label for="leoTaskBook">Verknüpfte Notizen</label><select id="leoTaskBook" name="notebookId"><option value="">Keine Verknüpfung</option>${S.notebooks.filter(b=>!b.deleted).map(b=>`<option value="${safe(b.id)}" ${draft.notebookId===b.id?'selected':''}>${safe(b.title)}</option>`).join('')}</select></div></div>${t?`<div class="sectionhead"><h3>Unteraufgaben ${childItems.length?`(${childItems.filter(c=>c.done).length}/${childItems.length})`:''}</h3>${action('Hinzufügen','subtask','plus','ghost',`data-id="${safe(t.id)}"`)}</div>${childItems.map(c=>`<div class="leo-subtask-row ${c.done?'done':''}"><input type="checkbox" data-leo-subcheck="${safe(c.id)}" ${c.done?'checked':''} aria-label="Unteraufgabe erledigt"><button type="button" data-leo="edit-task" data-id="${safe(c.id)}">${safe(c.title)}</button></div>`).join('')}`:''}${draft.source&&draft.source!=='local'?`<p class="leo-source-hint">Quelle: ${safe(draft.source)}. Änderungen ergänzen nur deinen lokalen Bestand; sie werden nicht an die Hochschule zurückgeschrieben.</p>`:''}`,fd=>{const title=String(fd.get('title')||'').trim();if(!title)throw Error('Bitte einen Titel eingeben.');const parent=String(fd.get('parentId')||'');assertParent(id,parent,S.tasks);const due=String(fd.get('due')||'');if(due&&!dateOK(due))throw Error('Bitte ein gültiges Datum wählen.');snapshot();const target=t||{id:uid(),created:Date.now(),source:'local'};Object.assign(target,{title,description:String(fd.get('description')||''),course:String(fd.get('course')||'').trim(),due,priority:String(fd.get('priority')),notebookId:String(fd.get('notebookId')||''),parentId:parent});setTaskStatus(target,String(fd.get('status')));if(!t)S.tasks.push(target);closeModal();saveTasks();toast(t?'Aufgabe aktualisiert.':'Neuer Schritt festgehalten.');},t?'Änderungen speichern':'Aufgabe anlegen',true);if(t){const footer=$('.modal-actions');footer.insertAdjacentHTML('afterbegin',action('Entfernen','remove-task','trash','danger',`data-id="${safe(t.id)}" style="margin-right:auto"`));}}
function taskMenu(id){const t=findTask(id);if(!t)return;modal(t.title,`<p class="small muted" style="margin-bottom:18px">Verschieben nach</p><div class="leo-menu-grid">${statuses.map(([s,n])=>`<button type="button" data-leo="set-status" data-status="${s}" data-id="${safe(id)}"><span class="leo-status-dot ${s}" style="display:inline-block;margin-right:7px"></span>${n}${taskState(t)===s?' ✓':''}</button>`).join('')}</div><div class="divider"></div><div class="row wrap">${action('Bearbeiten','edit-task','edit','',`data-id="${safe(id)}"`)}${action('Unteraufgabe','subtask','plus','',`data-id="${safe(id)}"`)}</div>`);}
function removeTask(id){const t=findTask(id);if(!t)return;if(!confirm('„'+t.title+'“ entfernen? Unteraufgaben bleiben erhalten und werden eigenständig.'))return;snapshot();S.tasks=S.tasks.filter(x=>x.id!==id);for(const c of S.tasks)if(c.parentId===id)c.parentId='';closeModal();saveTasks();toast('Aufgabe entfernt. Über „Rückgängig“ wiederherstellbar.');}
function folderEmoji(f){if(f.icon)return String(f.icon).slice(0,12);const n=String(f.name).toLowerCase();return n.includes('anato')?'🦴':n.includes('physio')?'🧠':n.includes('praxis')||n.includes('befund')?'🩺':'📚';}
function folderTree(parent='',seen=new Set(),depth=0){if(depth>12)return '';const allIds=new Set(S.folders.map(f=>f.id));return S.folders.filter(f=>parent?f.parentId===parent:!f.parentId||!allIds.has(f.parentId)).map(f=>{if(seen.has(f.id))return '';seen.add(f.id);const collapsed=S.settings.folderCollapsed.includes(f.id),hasChildren=S.folders.some(x=>x.parentId===f.id),books=S.notebooks.filter(b=>b.folderId===f.id&&!b.deleted);return `<div class="leo-folder-row"><button type="button" class="leo-folder-toggle" data-leo="folder-toggle" data-id="${safe(f.id)}" aria-label="${safe(f.name)} ${collapsed?'ausklappen':'einklappen'}" aria-expanded="${!collapsed}">${hasChildren||books.length?(collapsed?'›':'⌄'):'·'}</button><button class="nav ${view==='folder'&&folderFilter===f.id?'active':''}" data-act="folder" data-id="${safe(f.id)}"><span class="leo-folder-emoji">${safe(folderEmoji(f))}</span><span>${safe(f.name)}</span></button></div>${!collapsed&&(hasChildren||books.length)?`<div class="leo-folder-children">${folderTree(f.id,seen,depth+1)}${books.map(b=>`<button class="nav leo-folder-book" data-act="open-book" data-id="${safe(b.id)}">${icon('book',true)}<span>${safe(b.title)}</span></button>`).join('')}</div>`:''}`;}).join('');}
function folderDialog(id=''){const f=S.folders.find(x=>x.id===id);const valid=S.folders.filter(x=>x.id!==id&&!folderDescendants(id).has(x.id));formModal(f?'Dein Fach anpassen':'Ein neues Fach',`<div class="leo-form-grid"><div class="field span2"><label for="leoFolderName">Name</label><input id="leoFolderName" name="name" required maxlength="150" value="${safe(f?.name||'')}" placeholder="Zum Beispiel: Neurologie"></div><div class="field"><label for="leoFolderIcon">Icon / Emoji</label><input id="leoFolderIcon" name="icon" maxlength="12" value="${safe(f?folderEmoji(f):'📚')}"></div><div class="field"><label for="leoFolderColor">Fachfarbe</label><input id="leoFolderColor" name="color" type="color" value="${/^#[a-f0-9]{6}$/i.test(f?.color||'')?f.color:'#aa94e3'}"></div></div><div class="leo-icons">${icons.map(i=>`<button type="button" data-leo="choose-icon" data-value="${i}" aria-label="Icon ${i}">${i}</button>`).join('')}</div><div class="field"><label for="leoFolderParent">Einordnen unter</label><select id="leoFolderParent" name="parentId"><option value="">Workspace — oberste Ebene</option>${valid.map(x=>`<option value="${safe(x.id)}" ${f?.parentId===x.id?'selected':''}>${safe(x.name)}</option>`).join('')}</select></div>`,fd=>{const n=String(fd.get('name')||'').trim(),parent=String(fd.get('parentId')||'');if(!n)throw Error('Bitte einen Namen eingeben.');assertParent(id,parent,S.folders);const target=f||{id:uid()};Object.assign(target,{name:n,icon:String(fd.get('icon')||'📚').slice(0,12),color:String(fd.get('color')),parentId:parent});if(!f)S.folders.push(target);changed(false);closeModal();refresh();toast('Fach gespeichert.');});}
renderHome=function(){const books=S.notebooks.filter(b=>!b.deleted).sort((a,b)=>b.updated-a.updated).slice(0,3),tasks=S.tasks.filter(t=>!t.done).sort(taskSort).slice(0,3),due=S.cards.filter(c=>c.due<=Date.now()&&(!c.notebookId||S.notebooks.some(b=>b.id===c.notebookId&&!b.deleted))).length,open=S.tasks.filter(t=>!t.done).length;const activePages=S.pages.filter(p=>S.notebooks.some(b=>b.id===p.notebookId&&!b.deleted)).length;return `<div class="leo-home"><div class="pagehead"><div><div class="date-label">${localDate(Date.now(),{weekday:'long',day:'numeric',month:'long'})}</div><h1>Dein Raum, ${safe(firstName())}<span style="color:var(--accent)">.</span></h1><p>Alles, was du lernst. Alles, was du vorhast.</p></div>${btn('Neue Notiz','quick-note','plus','primary')}</div>${state.updateWorker?`<div class="leo-pwa-banner"><div class="grow"><strong>Eine neue Version ist bereit.</strong><br>Deine Notizen werden vor dem Neustart gespeichert.</div>${action('Aktualisieren','app-update','restore')}</div>`:''}<div class="leo-grid"><div class="leo-left"><section class="leo-hero"><div class="label">DEIN PERSÖNLICHER STUDY WORKSPACE</div><h2>Weniger Chaos.<br>Mehr <em>Aha.</em></h2><p>Gib deinen Gedanken einen Platz.<br>Und deinem nächsten Schritt eine Richtung.</p><div class="row">${btn('Einfach losschreiben','quick-note','pen','primary')}${action('Aufgaben öffnen','go-tasks','arrow','ghost')}</div><div class="leo-art" aria-hidden="true"><div class="leo-orbit"></div><div class="leo-sheet back"></div><div class="leo-sheet"><svg viewBox="0 0 137 178"><path d="M25 49q10-13 15 0t15 0t15 0M25 69q17-10 30 0t34-2M25 92q13-10 28 0t22-1" fill="none" stroke="#8b72b4" stroke-width="2.5" stroke-linecap="round"/><path d="M25 113h56" stroke="#cdbbff" stroke-width="9" stroke-linecap="round"/></svg></div><div class="leo-pen"></div><div class="leo-spark">✧</div><span class="leo-art-label">✦ Kleine Schritte. Große Ideen.</span></div></section><div class="leo-metrics"><button class="leo-metric" data-a v class="leo-task-mini"><button class="round-check" data-leo="complete-task" data-id="${safe(t.id)}" aria-label="${safe(t.title)} erledigen"></button><div class="grow"><button class="title" data-leo="edit-task" data-id="${safe(t.id)}">${safe(t.title)}</button><small>${safe(t.course||'Persönlich')} · ${safe(dateText(t.due))}</small></div></div>`).join(''):`<div class="leo-home-empty"><strong>Platz für deinen nächsten Schritt.</strong>Eine Aufgabe reicht, um anzufangen. Halte sie hier fest.</div>`}<button class="leo-aside-link" data-leo="go-tasks">Zum Aufgabenboard ${icon('arrow',true)}</button></section><section class="aside-card leo-focus"><div class="row between"><h3>Zeit für deinen Fokus</h3>${icon('clock',true)}</div><div class="focus-clock" data-focus-clock>${timeLabel(focusEnd?(focusEnd-Date.now())/1000:focusSeconds)}</div><p class="tiny muted">25 Minuten. Ein Thema. Du.</p><div class="row" style="margin-top:18px">${btn(focusEnd?'Pausieren':'Fokus starten','focus-toggle',focusEnd?'pause':'play','primary','style="flex:1"')}${ib('restore','focus-reset','Fokus zurücksetzen')}</div></section><section class="aside-card"><div class="sectionhead"><h3>Deine Verbindungen</h3>${icon('link',true)}</div>${[['✦','Leo / OpenClaw',bridge.capabilities.openclaw],['m','Moodle',bridge.capabilities.moodle],['↗','Levis',bridge.capabilities.levis]].map(([i,n,r])=>`<div class="connector-mini"><span class="row"><span class="service-mark">${i}</span>${n}</span><span class="tiny muted">${bridge.connected&&r?'Konfiguriert':'Nicht verbunden'}</span></div>`).join('')}<button class="leo-aside-link" data-act="nav" data-view="connections">Sicher einrichten ${icon('arrow',true)}</button></section><p class="leo-quote">Du musst nicht alles auf einmal wissen.<br>Nur neugierig bleiben.<b>DEIN LERNRAUM. DEIN TEMPO.</b></p></aside></div></div>`;};
renderShell=function(){normaliseSettings();core.renderShell();const brand=$('.brand');if(brand){brand.children[1].innerHTML='Leo<span style="color:var(--accent)">.</span>';brand.querySelector('.brand-mark').innerHTML='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 5v14h12M13 5v8h6" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';brand.insertAdjacentHTML('beforeend','<small class="leo-brand-tag">STUDIO</small>');}const nav=$('[data-act="nav"][data-view="library"]',$('#sidebar'));if(nav)nav.insertAdjacentHTML('afterend',`<button class="nav ${view==='tasks'?'active':''}" data-leo="go-tasks">${icon('panel')}<span>Aufgabenboard</span><span class="count">${S.tasks.filter(t=>!t.done).length}</span></button>`);const folders=$('#folderNav');if(folders)folders.innerHTML=folderTree();const profile=$('.profile');if(profile){profile.querySelector('strong').textContent=name();profile.querySelector('.avatar').textContent=name().split(/\s+/).map(s=>s[0]||'').slice(0,2).join('').toUpperCase();profile.style.cursor='pointer';profile.setAttribute('data-leo','profile');profile.setAttribute('title','Profil anpassen');}const crumbs=$('.breadcrumbs strong');if(view==='tasks'&&crumbs)crumbs.textContent='Aufgabenboard';$('#mobileNav').innerHTML=[['home','home','Heute'],['library','book','Notizen'],['tasks','panel','Aufgaben'],['study','cards','Lernen'],['connections','link','Mehr']].map(([v,ic,t])=>`<button ${v==='tasks'?'data-leo="go-tasks"':`data-act="nav" data-view="${v}"`} class="${view===v?'active':''}">${icon(ic)}${t}</button>`).join('');};

renderEditorTop=function(){core.renderEditorTop();const old=$('[data-act="toggle-inspector"]',$('#editorTop'));if(old)old.insertAdjacentHTML('afterend',`<button class="btn leo-chat-button" data-act="open-leo" aria-label="Leo-Assistent öffnen" title="Leo-Assistent öffnen">${icon('spark',true)}Leo</button>`);};
function widthForTool(){normaliseSettings();return S.settings.studio[['pen','highlight','eraser','laser'].includes(tool)?tool:'pen'];}
