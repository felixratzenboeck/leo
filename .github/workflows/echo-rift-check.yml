name: ECHO RIFT checks
on:
  push:
    branches: [game/echo-rift]
    paths:
      - websites/echo-rift/**
      - .github/workflows/echo-rift-check.yml
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: websites/echo-rift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests and offline build
        run: |
          node --test tests/engine.test.cjs
          python build.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser and P2P checks
        run: python tests/browser_e2e.py
      - name: Preserve exact tested source and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-rift-source-and-tests
          path: websites/echo-rift/
          retention-days: 14
          if-no-files-found: error
