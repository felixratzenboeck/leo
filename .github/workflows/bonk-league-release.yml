name: BONK LEAGUE verified HTML release
on:
  push:
    branches: [main]
    paths:
      - 'games/bonk-league/.release/**'
      - '.github/workflows/bonk-league-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bonk-league-html-release
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Restore checksum-verified original HTML and check JavaScript
        run: python3 games/bonk-league/.release/restore.py
      - name: Commit only the verified BONK game file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games/bonk-league/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(bonk-league): publish checksum-verified original standalone game'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Could not push without overwriting concurrent changes.' >&2
          exit 1
