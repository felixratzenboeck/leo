name: Leo Studio V2 build and browser checks
on:
  push:
    branches: [feat/leo-studio-v2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: leo-studio-v2-build
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/leo-studio-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/leo-studio-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed components once
        run: python .leo-studio-transfer/restore.py
      - name: Build against the preserved exact core
        run: python scripts/build-leo.py
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test real IndexedDB, backup and offline app shell
        run: python tests/leo-e2e.py
      - name: Save verified source and generated app to this branch only
        run: |
          git add index.html sw.js manifest.webmanifest leo-icon.svg leo-src scripts/build-leo.py tests/leo-e2e.py docs/leo-studio-v2.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(leo): verified Studio V2 app and editable components [skip ci]'
            git push origin HEAD:refs/heads/feat/leo-studio-v2
          fi
          git rev-parse HEAD > test-results/commit.txt
          git hash-object index.html > test-results/blob.txt
      - name: Keep exact build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leo-studio-v2-verified
          retention-days: 7
          path: |
            index.html
            sw.js
            manifest.webmanifest
            leo-icon.svg
            leo-src/
            scripts/build-leo.py
            tests/leo-e2e.py
            docs/leo-studio-v2.md
            test-results/*.json
            test-results/*.txt
            test-results/*.png
