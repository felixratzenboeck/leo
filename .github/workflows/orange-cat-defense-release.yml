name: Orange Cat Defense V2 verified release
on:
  push:
    branches: [main]
    paths:
      - 'games/orange-cat-defense/.release/**'
      - '.github/workflows/orange-cat-defense-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orange-cat-defense-release
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Restore and verify tested standalone HTML
        run: python3 games/orange-cat-defense/.release/restore.py
      - name: Publish only the verified game file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games/orange-cat-defense/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(orange-cat-defense): publish checksum-verified standalone V2'
          git pull --rebase origin main
          git push origin HEAD:main
